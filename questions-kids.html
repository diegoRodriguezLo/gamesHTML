<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎈 ¡El Gran Juego de Preguntas! 🎈</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #ffe259 0%, #ffa751 50%, #ff6b9d 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }

  .tarjeta {
    background: #fffdf5;
    border-radius: 32px;
    box-shadow: 0 16px 40px rgba(0,0,0,.25);
    padding: 28px;
    width: 100%;
    max-width: 760px;
    text-align: center;
    border: 6px solid #ffb703;
  }

  h1 { font-size: clamp(1.6rem, 5vw, 2.6rem); color: #d62828; margin-bottom: 8px; }
  h2 { font-size: clamp(1.2rem, 4vw, 1.8rem); color: #023047; margin-bottom: 14px; }
  p  { font-size: 1.1rem; color: #333; }

  .oculto { display: none !important; }

  /* ---------- Pantalla de inicio ---------- */
  .nombres { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 18px 0; }
  .nombres input {
    font-family: inherit;
    font-size: 1.2rem;
    padding: 12px 16px;
    border-radius: 16px;
    border: 3px solid #adb5bd;
    text-align: center;
    width: 220px;
  }
  .nombres input:focus { outline: none; border-color: #ffb703; }

  .boton {
    font-family: inherit;
    font-size: 1.4rem;
    font-weight: bold;
    padding: 16px 36px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: #2a9d8f;
    box-shadow: 0 6px 0 #1d7268;
    transition: transform .1s;
    margin-top: 10px;
  }
  .boton:active { transform: translateY(4px); box-shadow: 0 2px 0 #1d7268; }
  .boton.grande { font-size: 1.7rem; padding: 20px 48px; }

  /* ---------- Marcador ---------- */
  .marcador {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .equipo {
    flex: 1;
    border-radius: 20px;
    padding: 10px 8px;
    color: #fff;
    font-weight: bold;
    transition: transform .2s, box-shadow .2s;
  }
  .equipo .nombre { font-size: 1.1rem; overflow-wrap: anywhere; }
  .equipo .puntos { font-size: 2rem; }
  .equipo .globos { font-size: 1.4rem; }
  .eqA { background: #e63946; }
  .eqB { background: #457b9d; }
  .equipo.activA { transform: scale(1.08); box-shadow: 0 0 0 5px #ffd60a, 0 0 25px #ffd60a; }
  .equipo.activB { transform: scale(1.08); box-shadow: 0 0 0 5px #ffd60a, 0 0 25px #ffd60a; }

  .turno {
    font-size: 1.25rem;
    font-weight: bold;
    color: #023047;
    background: #ffd60a;
    border-radius: 999px;
    padding: 8px 18px;
    display: inline-block;
    margin-bottom: 14px;
  }
  .progreso { font-size: 1rem; color: #555; margin-bottom: 14px; }

  /* ---------- Pregunta ---------- */
  .pregunta {
    font-size: clamp(1.4rem, 4.5vw, 2rem);
    color: #023047;
    background: #e0f7fa;
    border: 4px dashed #4dd0e1;
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 20px;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .opciones {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .opcion {
    font-family: inherit;
    font-size: 1.35rem;
    font-weight: bold;
    padding: 20px 14px;
    border-radius: 22px;
    border: 4px solid #bde0fe;
    background: #fff;
    color: #023047;
    cursor: pointer;
    transition: transform .12s, background .2s;
    min-height: 84px;
  }
  .opcion:hover:not(:disabled) { transform: scale(1.05); background: #fff3b0; }
  .opcion:disabled { cursor: default; opacity: .95; }
  .opcion.ok     { background: #95d5b2; border-color: #2d6a4f; animation: saltar .5s; }
  .opcion.malo   { background: #ffb3c1; border-color: #d62828; animation: temblar .4s; }
  .opcion.tachada{ opacity: .45; text-decoration: line-through; }
  .opcion .emoji { font-size: 2rem; display: block; margin-bottom: 4px; }

  @keyframes saltar { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-14px) scale(1.06)} }
  @keyframes temblar { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }

  .mensaje {
    min-height: 64px;
    margin-top: 18px;
    font-size: 1.5rem;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .mensaje .puntos-ganados { font-size: 1.1rem; color: #2a9d8f; }

  /* ---------- Pantalla final ---------- */
  .final-puntos { font-size: 1.6rem; margin: 10px 0; color: #023047; font-weight: bold; }
  .campeon { font-size: 3rem; margin: 10px 0; }

  /* ---------- Confeti ---------- */
  .confeti {
    position: fixed;
    top: -20px;
    font-size: 1.6rem;
    pointer-events: none;
    z-index: 999;
    animation: caer linear forwards;
  }
  @keyframes caer {
    to { transform: translateY(110vh) rotate(720deg); opacity: .8; }
  }
</style>
</head>
<body>

<div class="tarjeta">

  <!-- ============ PANTALLA DE INICIO ============ -->
  <div id="pantallaInicio">
    <h1>🎈 ¡El Gran Juego de Preguntas! 🎈</h1>
    <p>2 equipos · 20 preguntas cada uno</p>

    <div class="marcador">
      <div class="equipo eqA" id="cajaA">
        <div class="nombre" id="etiquetaA"></div>

    <div class="progreso" id="progreso"></div>
    <div class="pregunta" id="pregunta"></div>
    <div class="opciones" id="opciones"></div>
    <div class="mensaje" id="mensaje"></div>
  </div>

  <!-- ============ PANTALLA FINAL ============ -->
  <div id="pantallaFinal" class="oculto">
    <h1>🏆 ¡Fin del juego! 🏆</h1>

</div>

let nombreA = "Equipo 1", nombreB = "Equipo 2";
let puntosA = 0, puntosB = 0;
let ronda = 0;          // 0..19
let faseEquipo = "A";   // en cada ronda primero juega A y luego B
let fallos = 0;         // fallos en la pregunta actual
let preguntasA, preguntasB;
let respondido = false;

function barajar(arr) {
  const copia = arr.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

function barajarPregunta(p) {
  // Mezcla las respuestas y recalcula el índice correcto
  const pares = p.r.map((texto, i) => ({ texto, esCorrecta: i === p.c }));
  const mezclado = barajar(pares);
  return { q: p.q, r: mezclado.map(x => x.texto), c: mezclado.findIndex(x => x.esCorrecta) };
}

// ==================== SONIDOS ====================
let audioCtx = null;
function pitido(frecs, dur = 0.18, tipo = "sine") {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    frecs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = tipo;
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime + i * dur);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (i + 1) * dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + i * dur);
      osc.stop(audioCtx.currentTime + (i + 1) * dur);
    });
  } catch (e) { /* sin sonido */ }
}
const sonBien  = () => pitido([523, 659, 784]);          // do-mi-sol
const sonGenial = () => pitido([523, 659, 784, 1047]);
const sonMal   = () => pitido([220, 165], 0.25, "square");

// ==================== CONFETI ====================
function confeti(n = 24) {
  const emojis = ["🎉", "⭐", "🎈", "🌟", "🎊", "🏅"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confeti";
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (1.2 + Math.random() * 1.5) + "s";
    c.style.fontSize = (1.2 + Math.random() * 1.6) + "rem";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

// ==================== FLUJO DEL JUEGO ====================
function empezarJuego() {
  nombreA = document.getElementById("nombreA").value.trim() || "Equipo 1";
  nombreB = document.getElementById("nombreB").value.trim() || "Equipo 2";
  // Elegimos 40 preguntas al azar SIN repetir: 20 para cada equipo
  const elegidas = barajar(bancoPreguntas.map(barajarPregunta));
  preguntasA = elegidas.slice(0, 20);
  preguntasB = elegidas.slice(20, 40);
  puntosA = 0; puntosB = 0; ronda = 0; faseEquipo = "A";
  document.getElementById("etiquetaA").textContent = nombreA;
  document.getElementById("etiquetaB").textContent = nombreB;
  document.getElementById("pantallaInicio").classList.add("oculto");
  document.getElementById("pantallaJuego").classList.remove("oculto");
  actualizarMarcador();
  mostrarPregunta();
}

function actualizarMarcador() {
  document.getElementById("puntosA").textContent = puntosA;
  document.getElementById("puntosB").textContent = puntosB;
  document.getElementById("globosA").textContent = "🎈".repeat(Math.min(5, Math.floor(puntosA / 200)));
  document.getElementById("globosB").textContent = "🎈".repeat(Math.min(5, Math.floor(puntosB / 200)));
  document.getElementById("cajaA").className = "equipo eqA" + (faseEquipo === "A" ? " activA" : "");
  document.getElementById("cajaB").className = "equipo eqB" + (faseEquipo === "B" ? " activB" : "");
}

function mostrarPregunta() {
  fallos = 0;
  respondido = false;
  const esA = faseEquipo === "A";
  const p = esA ? preguntasA[ronda] : preguntasB[ronda];

  document.getElementById("turno").textContent =
    "🎤 Turno de: " + (esA ? nombreA : nombreB);
  document.getElementById("progreso").textContent =
    "Pregunta " + (ronda + 1) + " de 20";
  document.getElementById("pregunta").textContent = p.q;
  document.getElementById("mensaje").innerHTML = "";
  actualizarMarcador();

  const cont = document.getElementById("opciones");
  cont.innerHTML = "";
  p.r.forEach((texto, i) => {
    const btn = document.createElement("button");
    btn.className = "opcion";
    // Separa el emoji del texto si existe
    const partes = texto.split(" ");
    const emoji = /\p{Emoji_Presentation}/u.test(partes[partes.length - 1]) ? partes.pop() : "";
    btn.innerHTML = (emoji ? `<span class="emoji">${emoji}</span>` : "") + partes.join(" ");
    btn.onclick = () => elegir(btn, i, p);
    cont.appendChild(btn);
  });
}

function elegir(btn, i, p) {
  if (respondido) return;
  const esA = faseEquipo === "A";
  const msg = document.getElementById("mensaje");
  const botones = [...document.querySelectorAll(".opcion")];

  if (i === p.c) {
    // ---------- ACIERTO ----------
    respondido = true;
    btn.classList.add("ok");
    botones.forEach(b => b.disabled = true);
    const puntos = fallos === 0 ? 100 : 50;
    if (esA) puntosA += puntos; else puntosB += puntos;
    actualizarMarcador();
    if (fallos === 0) {
      sonGenial();
      confeti(30);
      msg.innerHTML = `🎉 ¡¡MUY BIEN!! Acertaste a la primera 🎉<span class="puntos-ganados">+100 puntos</span>`;
    } else {
      sonBien();
      confeti(15);
      msg.innerHTML = `👏 ¡MUY BIEN! Acertaste en la segunda 👏<span class="puntos-ganados">+50 puntos</span>`;
    }
    botonSiguiente();
  } else {
    // ---------- FALLO ----------
    btn.classList.add("malo");
    btn.disabled = true;
    fallos++;
    if (fallos === 1) {
      sonMal();
      msg.innerHTML = "🔄 ¡Casi! Tienes una <b>SEGUNDA OPORTUNIDAD</b>, ¡inténtalo otra vez! 💪";
      setTimeout(() => btn.classList.add("tachada"), 600);
    } else {
      // Segundo fallo: se muestra la correcta y se pasa de pregunta
      respondido = true;
      botones.forEach(b => b.disabled = true);
      botones[p.c].classList.add("ok");
      sonMal();
      msg.innerHTML = "😅 ¡Oh, no! La respuesta era: <b>" + p.r[p.c] + "</b><br>No pasa nada, ¡la próxima será!";
      botonSiguiente();
    }
  }
}

function botonSiguiente() {
  const msg = document.getElementById("mensaje");
  const b = document.createElement("button");
  b.className = "boton";
  b.textContent = (faseEquipo === "A") ? "➡️ Turno del otro equipo" : "➡️ Siguiente pregunta";
  b.onclick = pasarSiguiente;
  msg.appendChild(b);
}

function pasarSiguiente() {
  if (faseEquipo === "A") {
    faseEquipo = "B";
  } else {
    faseEquipo = "A";
    ronda++;
  }
  if (ronda >= 20) { finalJuego(); return; }
  mostrarPregunta();
}

function finalJuego() {
  document.getElementById("pantallaJuego").classList.add("oculto");
  document.getElementById("pantallaFinal").classList.remove("oculto");
  document.getElementById("finalA").textContent = nombreA + ": " + puntosA + " puntos";
  document.getElementById("finalB").textContent = nombreB + ": " + puntosB + " puntos";
  const t = document.getElementById("campeonTexto");
  const e = document.getElementById("campeonEmoji");
  if (puntosA > puntosB)      { t.textContent = "¡Ganó " + nombreA + "!"; e.textContent = "🏆🥇"; }
  else if (puntosB > puntosA) { t.textContent = "¡Ganó " + nombreB + "!"; e.textContent = "🏆🥇"; }
  else                        { t.textContent = "¡EMPATE! ¡Los dos son geniales!"; e.textContent = "🤝🌟"; }
  sonGenial();
  confeti(60);
}
</script>
