"use strict";
/* =====================================================================
   ECHOES IN THE DARK — a dark-fantasy top-down action RPG
   Single-file, no external assets. All art is procedural canvas pixel art.
   Sections:
     1. Core setup & utilities      7. Combat / damage
     2. Audio (WebAudio synth)      8. Dialogue & quests
     3. Input                       9. Zone loading & transitions
     4. Tile art & map data        10. Update loop / state machine
     5. Pixel sprites              11. Rendering (world, lighting, HUD, screens)
     6. Entities & AI              12. Boot
   ===================================================================== */

/* ===================== 1. CORE SETUP & UTILITIES ===================== */
const TILE = 16, VW = 320, VH = 240, STEP = 1 / 60;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let SCALE = 3;

function resize() {
  SCALE = Math.max(1, Math.floor(Math.min(window.innerWidth / VW, window.innerHeight / VH)));
  canvas.width = VW * SCALE;
  canvas.height = VH * SCALE;
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
function hash(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul((s | 0) + 1, 1013904223);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function norm(x, y) { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; }

// Offscreen canvases: lighting mask + vignette
const lightCv = document.createElement('canvas'); lightCv.width = VW; lightCv.height = VH;
const lctx = lightCv.getContext('2d');
const vigCv = document.createElement('canvas'); vigCv.width = VW; vigCv.height = VH;
(function buildVignette() {
  const g = vigCv.getContext('2d');
  const gr = g.createRadialGradient(VW / 2, VH / 2, VH * 0.3, VW / 2, VH / 2, VH * 0.85);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(1, 'rgba(0,0,0,0.78)');
  g.fillStyle = gr; g.fillRect(0, 0, VW, VH);
})();

/* ===================== 2. AUDIO (procedural WebAudio) ===================== */
const Sound = {
  ac: null, master: null,
  init() {
    if (this.ac) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ac.destination);
    } catch (e) { this.ac = null; }
  },
  resume() { if (this.ac && this.ac.state === 'suspended') this.ac.resume().catch(() => {}); },
  tone(freq, dur, type, vol, slide, delay) {
    const c = this.ac; if (!c) return;
    const t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol, freq, delay) {
    const c = this.ac; if (!c) return;
    const t = c.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 2000;
    const g = c.createGain(); g.gain.value = vol || 0.2;
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t);
  }
};
function sfx(n) {
  const A = Sound; if (!A.ac) return;
  switch (n) {
    case 'slash': A.noise(0.09, 0.16, 4200); A.tone(540, 0.07, 'triangle', 0.07, 0.6); break;
    case 'hit': A.noise(0.08, 0.32, 1500); A.tone(170, 0.09, 'square', 0.1, 0.5); break;
    case 'kill': A.noise(0.25, 0.28, 900); A.tone(240, 0.25, 'sawtooth', 0.08, 0.3); break;
    case 'hurt': A.tone(300, 0.2, 'square', 0.14, 0.4); A.noise(0.12, 0.2, 800); break;
    case 'roll': A.noise(0.16, 0.1, 700); break;
    case 'pickup': A.tone(880, 0.06, 'square', 0.06); A.tone(1320, 0.08, 'square', 0.06, 1, 0.05); break;
    case 'heal': [523, 659, 784, 1046].forEach((f, i) => A.tone(f, 0.15, 'triangle', 0.1, 1, i * 0.07)); break;
    case 'blip': A.tone(360 + Math.random() * 60, 0.025, 'square', 0.025); break;
    case 'push': A.noise(0.28, 0.2, 300); break;
    case 'seal': A.tone(220, 0.7, 'triangle', 0.14, 2); A.noise(0.6, 0.2, 400); break;
    case 'chime0': A.tone(523, 0.5, 'sine', 0.18); break;
    case 'chime1': A.tone(659, 0.5, 'sine', 0.18); break;
    case 'chime2': A.tone(784, 0.6, 'sine', 0.18); A.tone(1046, 0.6, 'sine', 0.1, 1, 0.12); break;
    case 'wrong': A.tone(150, 0.35, 'sawtooth', 0.1, 0.7); break;
    case 'gate': A.noise(0.6, 0.25, 500); A.tone(90, 0.6, 'sawtooth', 0.07, 1.5); break;
    case 'roar': A.tone(95, 1.0, 'sawtooth', 0.18, 0.5); A.noise(1.0, 0.25, 500); break;
    case 'slam': A.noise(0.45, 0.45, 320); A.tone(60, 0.45, 'sine', 0.3, 0.5); break;
    case 'bolt': A.tone(720, 0.16, 'sawtooth', 0.04, 0.3); break;
    case 'charge': A.noise(0.35, 0.2, 1200); A.tone(200, 0.35, 'sawtooth', 0.07, 2); break;
    case 'warn': A.tone(420, 0.14, 'square', 0.05, 1.3); break;
    case 'growl': A.tone(110, 0.25, 'sawtooth', 0.06, 0.8); break;
    case 'quest': [392, 523, 659].forEach((f, i) => A.tone(f, 0.2, 'triangle', 0.1, 1, i * 0.09)); break;
    case 'death': A.tone(320, 1.2, 'triangle', 0.18, 0.25); break;
    case 'victory': [392, 494, 587, 784, 988].forEach((f, i) => A.tone(f, 0.4, 'triangle', 0.1, 1, i * 0.14)); break;
    case 'select': A.tone(600, 0.08, 'square', 0.06, 1.5); break;
    case 'summon': A.tone(200, 0.6, 'sine', 0.12, 3); A.noise(0.5, 0.12, 2500); break;
    case 'bossDie': A.tone(130, 2.0, 'sawtooth', 0.18, 0.2); A.noise(2.0, 0.3, 600); break;
  }
}

/* ===================== 3. INPUT ===================== */

const BLOCK_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab']);
window.addEventListener('keydown', e => {
  if (BLOCK_KEYS.has(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  Sound.init(); Sound.resume();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
function releaseAll() { for (const k in keys) keys[k] = false; }
window.addEventListener('blur', () => { releaseAll(); pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseAll(); pauseGame(); } });
const kDown = (...c) => c.some(k => keys[k]);
const kHit = (...c) => c.some(k => pressed[k]);
function clearPressed() { for (const k in pressed) delete pressed[k]; }

// ---- pixel drawing primitives (FLASHC overrides colour for hit-flash) ----
let FLASHC = null;
function R(g, c, x, y, w, h) { g.fillStyle = FLASHC || c; g.fillRect(x, y, w, h); }
function disc(g, c, cx, cy, r) {
  g.fillStyle = FLASHC || c;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.3);
    g.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
  }
}
function oval(g, c, cx, cy, rx, ry) {
  g.fillStyle = c;
  for (let dy = -ry; dy <= ry; dy++) {
    const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))) + 0.3);
    g.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
  }
}

// ---- tile textures ----
function drawGrass(g, x, y, tx, ty, pal) {
  R(g, pal[0], x, y, 16, 16);
  for (let i = 0; i < 9; i++) {
    const a = hash(tx, ty, i), b = hash(tx, ty, i + 20), c = hash(tx, ty, i + 40);
    R(g, c < 0.45 ? pal[1] : (c < 0.93 ? pal[2] : pal[3]), x + (a * 15 | 0), y + (b * 14 | 0), 1, c < 0.93 ? 2 : 1);
  }
}
function drawCaveFloor(g, x, y, tx, ty) {
  R(g, '#19171d', x, y, 16, 16);
  for (let i = 0; i < 7; i++) {
    const a = hash(tx, ty, i + 60), b = hash(tx, ty, i + 70), c = hash(tx, ty, i + 80);
    R(g, c < 0.5 ? '#221f28' : '#121015', x + (a * 15 | 0), y + (b * 15 | 0), c < 0.2 ? 2 : 1, 1);
  }
  if (hash(tx, ty, 99) < 0.18) { R(g, '#0e0d11', x + 3, y + 8, 5, 1); R(g, '#0e0d11', x + 7, y + 9, 3, 1); R(g, '#0e0d11', x + 9, y + 10, 1, 2); }
}
function drawCobble(g, x, y, tx, ty) {
  R(g, '#28272b', x, y, 16, 16);
  const cols = ['#45434a', '#4d4b52', '#3e3c43', '#545158'];
  for (let r = 0; r < 3; r++) {
    const off = (r % 2) ? -3 : 1;
    for (let c = 0; c < 4; c++) {
      const sx = x + off + c * 6, sy = y + r * 5 + 1;
      const x0 = Math.max(sx, x), x1 = Math.min(sx + 5, x + 16);
      if (x1 <= x0) continue;
      R(g, cols[(hash(tx * 4 + c, ty * 3 + r, 5) * 4) | 0], x0, sy, x1 - x0, 4);
      R(g, '#5f5c64', x0, sy, x1 - x0, 1);
      R(g, '#323036', x0, sy + 3, x1 - x0, 1);
    }
  }
}
function drawDirt(g, x, y, tx, ty) {
  R(g, '#383024', x, y, 16, 16);
  for (let i = 0; i < 8; i++) {
    const a = hash(tx, ty, i + 11), b = hash(tx, ty, i + 31), c = hash(tx, ty, i + 51);
    R(g, c < 0.4 ? '#443a2b' : (c < 0.8 ? '#2c251c' : '#565046'), x + (a * 15 | 0), y + (b * 15 | 0), c < 0.8 ? 2 : 1, 1);
  }
}
function groundFor(g, w, tx, ty, x, y) {
  if (w.def.base === ':') drawCaveFloor(g, x, y, tx, ty);
  else drawGrass(g, x, y, tx, ty, w.def.grass);
}
function tileAt(w, tx, ty) {
  tx = clamp(tx, 0, w.W - 1); ty = clamp(ty, 0, w.H - 1);
  return w.tiles[ty][tx];
}
function hasWindow(tx, ty) { return hash(tx, ty, 7) < 0.55; }

function drawTileArt(g, w, tx, ty) {
  const ch = w.tiles[ty][tx], x = tx * 16, y = ty * 16;
  const shadow = (cx, cy, rx, ry) => oval(g, 'rgba(0,0,0,0.35)', cx, cy, rx, ry);
  switch (ch) {
    case '.': drawGrass(g, x, y, tx, ty, w.def.grass); break;
    case ',': drawCobble(g, x, y, tx, ty); break;
    case '_': drawDirt(g, x, y, tx, ty); break;
    case ':': drawCaveFloor(g, x, y, tx, ty); break;
    case '"':
      drawGrass(g, x, y, tx, ty, w.def.grass);
      for (let i = 0; i < 5; i++) {
        const h = 4 + (hash(tx, ty, i + 90) * 5 | 0);
        R(g, i % 2 ? '#5b5536' : '#47432a', x + 2 + i * 3, y + 14 - h, 1, h);
        R(g, '#6c6544', x + 2 + i * 3, y + 14 - h, 1, 1);
      }
      break;
    case 'x':
      drawGrass(g, x, y, tx, ty, w.def.grass);
      shadow(x + 8, y + 13, 5, 1);
      R(g, '#4a3a2a', x + 7, y + 7, 1, 6); R(g, '#4a3a2a', x + 5, y + 8, 2, 1); R(g, '#4a3a2a', x + 4, y + 6, 1, 2);
      R(g, '#4a3a2a', x + 8, y + 9, 3, 1); R(g, '#4a3a2a', x + 11, y + 7, 1, 2); R(g, '#3a2d20', x + 9, y + 5, 1, 4);
      break;
    case 'T':
      drawGrass(g, x, y, tx, ty, w.def.grass);
      shadow(x + 8, y + 14, 6, 2);
      R(g, '#2e2118', x + 7, y + 10, 3, 5);
      disc(g, '#141e16', x + 8, y + 7, 7);
      disc(g, '#1c2a1d', x + 7, y + 6, 5);
      disc(g, '#253726', x + 6, y + 5, 3);
      R(g, '#304531', x + 5, y + 3, 2, 1);
      for (let i = 0; i < 4; i++) R(g, '#0e150f', x + 3 + (hash(tx, ty, i + 5) * 10 | 0), y + 3 + (hash(tx, ty, i + 9) * 8 | 0), 1, 1);
      break;
    case 'd':
      drawGrass(g, x, y, tx, ty, w.def.grass);
      shadow(x + 8, y + 14, 5, 1);
      R(g, '#3d342c', x + 7, y + 4, 2, 11); R(g, '#52473c', x + 7, y + 4, 1, 11);
      R(g, '#3d342c', x + 4, y + 5, 3, 1); R(g, '#3d342c', x + 3, y + 3, 1, 2);

// ---- collision ----
function tileSolid(tx, ty) {
  const w = world;
  tx = clamp(tx, 0, w.W - 1); ty = clamp(ty, 0, w.H - 1);
  if (SOLID.has(w.tiles[ty][tx])) return true;
  const d = w.dyn.get(ty * w.W + tx);
  if (d) return d.kind === 'gate' ? !gateIsOpen(d) : true;
  return false;
}
const tileSolidAt = (px, py) => tileSolid(Math.floor(px / 16), Math.floor(py / 16));
function rectBlocked(x, y, w, h) {
  const x0 = Math.floor(x / 16), x1 = Math.floor((x + w - 0.01) / 16);
  const y0 = Math.floor(y / 16), y1 = Math.floor((y + h - 0.01) / 16);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileSolid(tx, ty)) return true;
  return false;
}
function blockedFor(e, x, y) {
  const hw = e.w / 2, hh = e.h / 2;

  if (e.isPlayer) {
    for (const n of world.npcs) if (Math.abs(n.x - x) < (n.w + e.w) / 2 && Math.abs(n.y - y) < (n.h + e.h) / 2) return true;
  } else if (x - hw < 0 || y - hh < 0 || x + hw > world.W * 16 || y + hh > world.H * 16) return true;
  return false;
}
function moveAxis(e, d, axis) {
  if (!d) return false;
  const s = Math.sign(d); let m = Math.abs(d);
  while (m > 0) {
    const st = Math.min(1, m);
    const nx = axis === 0 ? e.x + s * st : e.x, ny = axis === 1 ? e.y + s * st : e.y;
    if (blockedFor(e, nx, ny)) return true;
    e.x = nx; e.y = ny; m -= st;
  }
  return false;
}
function slideCorner(e, sx, sy) {
  for (let off = 1; off <= 6; off++) for (const s of [-1, 1]) {
    const ox = sy ? s * off : 0, oy = sx ? s * off : 0;
    if (!blockedFor(e, e.x + ox, e.y + oy) && !blockedFor(e, e.x + ox + sx, e.y + oy + sy)) {
      const stx = sy ? s * 0.75 : 0, sty = sx ? s * 0.75 : 0;
      if (!blockedFor(e, e.x + stx, e.y + sty)) { e.x += stx; e.y += sty; }
      return;
    }

}
function moveEntity(e, dx, dy) {
  const bx = moveAxis(e, dx, 0);
  const by = moveAxis(e, dy, 1);
  if (e.isPlayer) {
    if (bx && Math.abs(dy) < 0.01) slideCorner(e, Math.sign(dx), 0);
    if (by && Math.abs(dx) < 0.01) slideCorner(e, 0, Math.sign(dy));
  }

}
function hasLOS(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 6);
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (tileSolidAt(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) return false;
  }
  return true;
}
function overlapsPlayer(e, pad) {
  const p = player;
  return Math.abs(e.x - p.x) < (e.w + p.w) / 2 + pad && Math.abs(e.y - p.y) < (e.h + p.h) / 2 + pad;
}
function gateIsOpen(g) {
  switch (g.group) {
    case 'Q': return Q.gateOpen;
    case 'G': return Q.seal1;
    case 'H': return Q.seal2;
    case 'J': return !(world.boss && world.boss.active && !world.boss.dead);

  return true;
}

// ---- enemies ----
function makeWaypoints(x, y) {
  const pts = [{ x, y }];
  for (let i = 0; i < 12 && pts.length < 3; i++) {
    const a = Math.random() * Math.PI * 2, r = 24 + Math.random() * 40;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (px < 16 || py < 16 || px > world.W * 16 - 16 || py > world.H * 16 - 16) continue;
    if (!rectBlocked(px - 7, py - 7, 14, 14) && hasLOS(x, y, px, py)) pts.push({ x: px, y: py });
  }
  return pts;
}

  const T = ETYPES[type];

function updateEnemy(e, dt) {
  const T = e.T;

  if (e.stun > 0) {

        if (e.state === 'return') e.state = 'patrol';

    }
    case 'chase': {
      if (!sees) { e.lostT += dt; if (e.lostT > 1.8) { e.state = 'return'; e.wpi = 0; break; } } else e.lostT = 0;
      if (dp > T.lose && !e.alwaysAggro) { e.state = 'return'; e.wpi = 0; break; }

function separateEnemies() {

      } else if (b.t <= 0) { b.state = 'walk'; b.cd = p2 ? 0.6 : 1.1; }

    }
    case 'stunned':
      b.t -= dt;

      break;
    case 'slamWind':
      b.t -= dt;
      if (b.t <= 0) {
        b.state = 'recover'; b.t = 0.55; shake(0.35, 5); sfx('slam');
        world.effects.push({ kind: 'wave', x: b.x, y: b.y + 4, r: 6, max: p2 ? 115 : 88, speed: p2 ? 170 : 140, hit: false, delay: 0 });
        if (p2) world.effects.push({ kind: 'wave', x: b.x, y: b.y + 4, r: 6, max: 115, speed: 170, hit: false, delay: 0.38 });
        burst(b.x, b.y + 6, 16, '#4a4652', 110, 0.5, 2, 100);

    case 'fanWind':

    case 'summon':

            const a = Math.random() * Math.PI * 2, sx = b.x + Math.cos(a) * 40, sy = b.y + Math.sin(a) * 40;

    case 'recover':

      break;
    case 'transition':
      b.t -= dt;
      if (Math.random() < 0.8) burst(b.x + rand(-14, 14), b.y - rand(0, 34), 1, '#9a3ad0', 40, 0.7, 2, -30);

}
function finishBoss(b) {

// ---- pickups / particles / floaters ----
function makePickup(type, x, y) { return { type, x, y, t: 0, vy: -50, z: 0 }; }
function burst(x, y, n, c, sp, life, s, grav) {

}

/* ===================== 7. COMBAT / DAMAGE ===================== */
function shake(t, m) {
  if (game.shakeT <= 0) game.shakeMag = 0;
  game.shakeT = Math.max(game.shakeT, t);
  game.shakeMag = Math.max(game.shakeMag, m);
}
function hurtPlayer(dmg, sx, sy) {
  const p = player;

  p.hp -= dmg;
  p.iframes = 1.0; p.blinkT = 1.0;
  const d = norm(p.x - sx, p.y - sy);
  p.kx = d.x * 190; p.ky = d.y * 190;
  p.atkT = 0;
  shake(0.25, 3);
  floater(p.x, p.y - 18, '-' + dmg, '#ff5050');
  burst(p.x, p.y - 6, 8, '#a01818', 70, 0.5, 1, 120);
  sfx('hurt');
  if (p.hp <= 0) {
    p.hp = 0; p.dead = true; p.deathT = 1.8;
    sfx('death');
    burst(p.x, p.y - 6, 30, '#6a0a10', 90, 1.0, 2, 60);
  }
  return true;
}
function playerDamage() { return player.cursed ? 4 : 2; }
function damageEnemy(e, dmg) {
  e.hp -= dmg; e.flash = 0.15;
  const d = norm(e.x - player.x, e.y - player.y);
  e.kx = d.x * 175; e.ky = d.y * 175; e.stun = 0.22;
  if (e.state === 'windup' || e.state === 'lunge') { e.state = 'recover'; e.t = 0.35; }
  if (e.state === 'patrol' || e.state === 'return') { e.state = 'chase'; e.lostT = 0; }
  floater(e.x, e.y - 16, String(dmg), player.cursed ? '#ff5a7a' : '#ffffff');
  burst(e.x, e.y - 4, 7, e.T.blood, 80, 0.45, 1, 100);
  sfx('hit');
  shake(0.08, player.cursed ? 2.2 : 1.2);
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  e.dead = true;
  player.kills++;
  burst(e.x, e.y - 4, 18, e.T.blood, 110, 0.7, 2, 80);
  burst(e.x, e.y - 4, 8, '#1a1a1a', 50, 0.9, 2, -20);
  sfx('kill');
  if (!e.alwaysAggro) {
    const r = Math.random();
    const heartChance = player.hp < player.maxHp ? 0.32 : 0.12;
    if (r < heartChance) world.pickups.push(makePickup('heart', e.x, e.y));
    else if (r < heartChance + 0.5) world.pickups.push(makePickup('shard', e.x, e.y));
  }

    Q.hounds = Math.min(5, Q.hounds + 1);

    if (Q.hounds >= 5) {

}
function damageBoss(b, dmg) {
  if (b.state === 'transition' || b.state === 'dying' || b.state === 'intro' || b.state === 'dormant' || b.dead) return;
  let amt = dmg;
  const crit = b.state === 'stunned';
  if (crit) amt = Math.round(dmg * 1.5);
  b.hp -= amt; b.flash = 0.12;
  floater(b.x + rand(-6, 6), b.y - 40, (crit ? 'CRIT ' : '') + amt, crit ? '#ffd040' : (player.cursed ? '#ff5a7a' : '#ffffff'));
  burst(b.x, b.y - 12, 6, '#2a1a3a', 70, 0.5, 2, 60);
  sfx('hit'); shake(0.07, 1.6);
  const d = norm(player.x - b.x, player.y - b.y);
  player.kx += d.x * 70; player.ky += d.y * 70;
  if (b.hp <= 0) {
    b.hp = 0; b.state = 'dying'; b.t = 2.2;
    sfx('bossDie'); shake(1.4, 5);
    world.projectiles.length = 0;
    world.effects = world.effects.filter(f => f.kind !== 'wave');
    for (const e of world.enemies) { e.dead = true; burst(e.x, e.y - 6, 12, '#6a2a9a', 60, 0.6, 2, 0); }
    return;
  }
  if (b.phase === 1 && b.hp <= b.maxHp / 2) {
    b.phase = 2; b.state = 'transition'; b.t = 1.5;
    shake(0.9, 5); sfx('roar');

}
function startAttack() {
  const p = player;
  p.atkT = 0.22; p.atkCD = 0.34; p.atkHit = new Set();
  p.atkAng = Math.atan2(p.fy, p.fx);
  sfx('slash');
}
function attackHits() {
  const p = player;
  if (p.atkT < 0.05) return;
  const cx = p.x, cy = p.y - 3, reach = 22, fa = p.atkAng;
  const test = (tx, ty, r) => {
    const d = Math.hypot(tx - cx, ty - cy);
    if (d > reach + r) return false;
    if (d < 9) return true;
    return Math.abs(angDiff(Math.atan2(ty - cy, tx - cx), fa)) < 1.3;
  };
  for (const e of world.enemies) {
    if (e.dead || p.atkHit.has(e)) continue;
    if (test(e.x, e.y - 3, e.T.r)) { p.atkHit.add(e); damageEnemy(e, playerDamage()); }
  }
  const b = world.boss;
  if (b && !b.dead && !p.atkHit.has(b) && test(b.x, b.y - 8, 14)) { p.atkHit.add(b); damageBoss(b, playerDamage()); }
  for (const c of world.crystals) {
    if (p.atkHit.has(c)) continue;
    if (test(c.tx * 16 + 8, c.ty * 16 + 7, 6)) { p.atkHit.add(c); hitCrystal(c); }
  }
}

const CRYSTAL_ORDER = ['red', 'blue', 'amber'];
function hitCrystal(c) {
  c.flash = 0.2;
  burst(c.tx * 16 + 8, c.ty * 16 + 6, 6, CRYSTAL_COL[c.color][1], 50, 0.4, 1, 0);

    toast('The crystals dim... that was not the carved order.');
  }
}
function plateCovered(pl) { return world.blocks.some(b => !b.moving && b.tx === pl.tx && b.ty === pl.ty); }
function checkPlates() {
  if (Q.seal1 || world.plates.length === 0) return;
  if (world.plates.every(plateCovered)) {
    Q.seal1 = true; sfx('seal'); sfx('gate'); shake(0.5, 3);
    toast('Stone grinds on stone. The stone seal opens!');
    checkSeals();
  }
}
function checkSeals() { if (Q.seal1 && Q.seal2) advance(5); }
function tryPush(dx, dy, tol) {
  const p = player;
  const probeX = p.x + dx * (p.w / 2 + 3), probeY = p.y + dy * (p.h / 2 + 3);
  const tx = Math.floor(probeX / 16), ty = Math.floor(probeY / 16);
  const W = world.W;
  const b = world.dyn.get(ty * W + tx);
  if (!b || b.kind !== 'block' || b.moving) return false;
  if (Q.seal1) { toastOnce('blocklocked', 'The stone is fused to the plate. It will not budge.'); return false; }
  if (dx !== 0 && Math.abs(p.y - (ty * 16 + 8)) > tol) return false;
  if (dy !== 0 && Math.abs(p.x - (tx * 16 + 8)) > tol) return false;
  const nx = tx + dx, ny = ty + dy;
  if (nx < 0 || ny < 0 || nx >= W || ny >= world.H) return false;
  if (tileSolid(nx, ny)) return false;
  for (const e of world.enemies) if (Math.abs(e.x - (nx * 16 + 8)) < 8 + e.w / 2 && Math.abs(e.y - (ny * 16 + 8)) < 8 + e.h / 2) return false;
  b.moving = true; b.fromX = tx; b.fromY = ty; b.tx = nx; b.ty = ny; b.t = 0;
  world.dyn.set(ny * W + nx, b);
  sfx('push');
  return true;
}
function updateBlocks(dt) {
  for (const b of world.blocks) {
    if (!b.moving) continue;
    b.t += dt / 0.28;
    if (b.t >= 1) {
      b.t = 1; b.moving = false;
      world.dyn.delete(b.fromY * world.W + b.fromX);
      burst(b.tx * 16 + 8, b.ty * 16 + 14, 6, '#4a4652', 40, 0.4, 1, 0);
      checkPlates();
    }
  }
}
function resetBlocks() {
  const W = world.W;
  for (const b of world.blocks) {
    world.dyn.delete(b.ty * W + b.tx);
    if (b.moving) world.dyn.delete(b.fromY * W + b.fromX);
  }
  for (const b of world.blocks) {
    b.moving = false; b.tx = b.homeX; b.ty = b.homeY; b.t = 1;
    world.dyn.set(b.ty * W + b.tx, b);
    burst(b.tx * 16 + 8, b.ty * 16 + 8, 10, '#5a8ac8', 50, 0.6, 1, 0);
  }
}

const DLG = { lines: [], i: 0, chars: 0, done: null, wrapped: null };

function startDialogue(lines, onDone) {

function endDialogue() {
  game.state = 'PLAYING';
  const cb = DLG.done;
  DLG.done = null; DLG.lines = []; DLG.wrapped = null;

}
function updateDialogue(dt) {
  if (kHit('Escape', 'KeyP')) { pauseGame(); return; }
  const line = DLG.lines[DLG.i];
  if (!line) { endDialogue(); return; }
  const len = line.text.length;
  if (DLG.chars < len) {
    const before = Math.floor(DLG.chars);
    DLG.chars = Math.min(len, DLG.chars + dt * 50);
    if (Math.floor(DLG.chars) !== before && Math.floor(DLG.chars) % 3 === 0) sfx('blip');
  }
  if (kHit('KeyE', 'Enter', 'NumpadEnter', 'Space', 'KeyJ')) {
    if (DLG.chars < len) DLG.chars = len;
    else {
      DLG.i++; DLG.chars = 0; DLG.wrapped = null;
      if (DLG.i >= DLG.lines.length) endDialogue();
    }
  }
}

/* ===================== 9. ZONE LOADING & TRANSITIONS ===================== */
const NPC_DEF = {
  elder: { name: 'Elder Aldwin', pal: { skin: '#c9a88a', hair: '#bdbdb4', body: '#3e3350', legs: '#2a2230', belt: '#6a5a30', extra: 'elder' }, talk: talkElder },
  smith: { name: 'Garrick the Smith', pal: { skin: '#a8775a', hair: '#2a1a12', body: '#4a3a30', legs: '#2a2018', belt: '#1a1210', extra: 'smith' }, talk: talkSmith },
  farmer: { name: 'Farmer Tobin', pal: { skin: '#c09a78', hair: '#5a4a30', body: '#4a5032', legs: '#3a3020', belt: '#2a2010', extra: 'farmer' }, talk: talkFarmer },
  mira: { name: 'Mira', pal: { skin: '#d8b8a0', hair: '#7a2e22', body: '#2e4a5a', legs: '#22303a', belt: '#a08a50', extra: 'mira' }, talk: talkMira }
};
function guessFloor(rows, def, x, y) {
  const cand = [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]];
  for (const [cx, cy] of cand) {
    const ch = (rows[cy] || '')[cx];
    if (ch && !SOLID.has(ch) && !SPAWN_CHARS.has(ch) && ch !== 'P' && ch !== 'Z' && ch !== 'O') return ch;
  }
  return def.base;
}
function loadZone(id) {
  const def = ZONES[id], rows = def.map, W = def.w, H = rows.length;
  const w = { id, def, W, H, tiles: [], dyn: new Map(), enemies: [], npcs: [], blocks: [], crystals: [], gates: [], plates: [],
    interact: [], torches: [], windows: [], fonts: [], pickups: [], projectiles: [], particles: [], floaters: [], effects: [],
    boss: null, mira: null, remains: null, crySeq: [], time: 0, spawn: { x: W * 8, y: H * 8 }, layer: null };
  world = w;
  const pending = [];
  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) {
      let ch = rows[y][x];
      if (ch === undefined) ch = def.base === ':' ? 'X' : '#';
      if (SPAWN_CHARS.has(ch)) { pending.push({ ch, x, y }); ch = guessFloor(rows, def, x, y); }
      row.push(ch);
    }
    w.tiles.push(row);
  }
  // static features
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = w.tiles[y][x], cx = x * 16 + 8, cy = y * 16 + 8;
    if (ch === 't') w.torches.push({ x: cx, y: cy - 6, seed: Math.random() * 100 });
    else if (ch === 'w' && id === 'village' && hasWindow(x, y)) w.windows.push({ x: cx, y: cy });
    else if (ch === 'P') w.plates.push({ tx: x, ty: y });
    else if (ch === 'W') w.interact.push({ x: cx, y: cy, label: 'Drink', act: () => healAt("You drink from the old well. The cold water steadies your heart.") });
    else if (ch === 'F') { w.fonts.push({ x: cx, y: cy }); w.interact.push({ x: cx, y: cy, label: 'Drink', act: () => healAt("The font's water glows faintly. Your wounds close.") }); }
    else if (ch === 'I') w.interact.push({ x: cx, y: cy, label: 'Read', act: readInscription });
    else if (ch === 'Z') w.interact.push({ x: cx, y: cy, label: 'Rune', act: useResetRune });
  }
  // spawns
  for (const s of pending) {
    const cx = s.x * 16 + 8, cy = s.y * 16 + 8, key = s.y * W + s.x;
    switch (s.ch) {
      case '@': w.spawn = { x: cx, y: cy }; break;
      case 'E': case 'S': case 'L': case 'M': {
        const kind = { E: 'elder', S: 'smith', L: 'farmer', M: 'mira' }[s.ch];
        const npc = { kind, def: NPC_DEF[kind], x: cx, y: cy + 3, w: 10, h: 10, dir: 'down', anim: 0, name: NPC_DEF[kind].name };
        w.npcs.push(npc);
        if (kind === 'mira') w.mira = npc;
        w.interact.push({ x: npc.x, y: npc.y, label: 'Talk', act: () => { faceToward(npc); NPC_DEF[kind].talk(); } });
        break;
      }
      case '1': w.enemies.push(makeEnemy('hound', cx, cy)); break;
      case '2': w.enemies.push(makeEnemy('goblin', cx, cy)); break;
      case '3': w.enemies.push(makeEnemy('shade', cx, cy)); break;
      case 'N': if (!Q.bossDefeated) w.boss = makeBoss(cx, cy); break;
      case 'B': { const b = { kind: 'block', tx: s.x, ty: s.y, homeX: s.x, homeY: s.y, moving: false, t: 1, fromX: s.x, fromY: s.y }; w.blocks.push(b); break; }
      case 'R': case 'U': case 'Y': {
        const c = { kind: 'crystal', tx: s.x, ty: s.y, color: { R: 'red', U: 'blue', Y: 'amber' }[s.ch], lit: Q.seal2, flash: 0 };
        w.crystals.push(c); w.dyn.set(key, c); break;
      }
      case 'K': {
        const r = { kind: 'remains', tx: s.x, ty: s.y };
        w.remains = r; w.dyn.set(key, r);
        w.interact.push({ x: cx, y: cy, label: 'Search', act: searchRemains });
        break;
      }
      case 'Q': case 'G': case 'H': case 'J': {
        const g = { kind: 'gate', group: s.ch, tx: s.x, ty: s.y, open: 0 };
        g.open = gateIsOpen(g) ? 1 : 0;
        w.gates.push(g); w.dyn.set(key, g);
        w.interact.push({ x: cx, y: cy, label: 'Examine', act: () => examineGate(g), enabled: () => !gateIsOpen(g) });
        break;
      }
    }
  }
  // blocks: if the stone seal is already broken, rest them on their plates
  if (Q.seal1) w.blocks.forEach((b, i) => { if (w.plates[i]) { b.tx = w.plates[i].tx; b.ty = w.plates[i].ty; } });
  for (const b of w.blocks) w.dyn.set(b.ty * W + b.tx, b);
  // pre-render the static tile layer
  const cv = document.createElement('canvas');
  cv.width = W * 16; cv.height = H * 16;
  const g = cv.getContext('2d');
  FLASHC = null;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) drawTileArt(g, w, x, y);
  w.layer = cv;
  return w;
}

const game = { state: 'TITLE', prevState: 'PLAYING', t: 0, stateT: 0, banner: null, toasts: [], toastSeen: new Set(),

    loadZone(tr.to);

function respawn() {

  player.iframes = 1.5; player.blinkT = 1.5; player.kx = player.ky = 0; player.atkT = 0; player.rollT = 0;
  game.trans = null; game.shakeT = 0;

}

function dirOf(x, y) { return Math.abs(x) > Math.abs(y) + 0.01 ? (x < 0 ? 'left' : 'right') : (y < 0 ? 'up' : 'down'); }
function findInteract() {
  let best = null, bd = 23;
  for (const it of world.interact) {
    if (it.enabled && !it.enabled()) continue;
    const d = Math.hypot(player.x - it.x, player.y - it.y);
    if (d < bd) { bd = d; best = it; }
  }
  return best;
}
function updatePlayer(dt) {
  const p = player;
  if (p.dead) {
    p.deathT -= dt;
    if (p.deathT <= 0) { game.state = 'GAME_OVER'; game.stateT = 0; }
    return;
  }
  p.iframes = Math.max(0, p.iframes - dt); p.blinkT = Math.max(0, p.blinkT - dt);
  p.atkCD -= dt; p.rollCD -= dt;
  const ix = (kDown('KeyD', 'ArrowRight') ? 1 : 0) - (kDown('KeyA', 'ArrowLeft') ? 1 : 0);
  const iy = (kDown('KeyS', 'ArrowDown') ? 1 : 0) - (kDown('KeyW', 'ArrowUp') ? 1 : 0);
  const len = Math.hypot(ix, iy);
  const nx = len ? ix / len : 0, ny = len ? iy / len : 0;

  if (kHit('Space', 'KeyJ') && p.atkCD <= 0 && p.rollT <= 0) startAttack();
  if (kHit('ShiftLeft', 'ShiftRight', 'KeyK') && p.rollCD <= 0 && p.rollT <= 0 && p.atkT <= 0) {
    p.rollT = 0.3; p.rollCD = 0.6; p.iframes = Math.max(p.iframes, 0.36);
    if (len) { p.rdx = nx; p.rdy = ny; p.fx = nx; p.fy = ny; p.dir = dirOf(nx, ny); } else { p.rdx = p.fx; p.rdy = p.fy; }
    sfx('roll');
  }
  if (kHit('KeyE')) {
    const it = findInteract();
    if (it) { it.act(); return; }
    const fd = Math.abs(p.fx) > Math.abs(p.fy) ? [Math.sign(p.fx), 0] : [0, Math.sign(p.fy) || 1];
    tryPush(fd[0], fd[1], 7);
  }

  let vx = 0, vy = 0;
  if (p.rollT > 0) {
    p.rollT -= dt;
    vx = p.rdx * 175; vy = p.rdy * 175;
    if (Math.random() < 0.5) world.particles.push({ x: p.x + rand(-3, 3), y: p.y + 3, vx: rand(-10, 10), vy: rand(-12, 0), life: 0.3, max: 0.3, c: '#5a5a62', s: 1, g: 0 });
  } else {
    let sp = p.speed;
    if (p.atkT > 0) sp *= 0.35;
    vx = nx * sp; vy = ny * sp;
    if (len && p.atkT <= 0) { p.fx = nx; p.fy = ny; p.dir = dirOf(nx, ny); }
  }
  vx += p.kx; vy += p.ky;
  p.kx = approach(p.kx, 0, 900 * dt); p.ky = approach(p.ky, 0, 900 * dt);
  moveEntity(p, vx * dt, vy * dt);
  p.moving = len > 0 || p.rollT > 0;
  if (p.moving) p.anim += dt * 8;

  if (p.atkT > 0) { p.atkT -= dt; attackHits(); }

  // pushing blocks by walking into them
  let pdx = 0, pdy = 0;
  if (ix && !iy) pdx = ix; else if (iy && !ix) pdy = iy;
  if ((pdx || pdy) && p.rollT <= 0) {
    const tx = Math.floor((p.x + pdx * (p.w / 2 + 3)) / 16), ty = Math.floor((p.y + pdy * (p.h / 2 + 3)) / 16);
    const b = world.dyn.get(ty * world.W + tx);
    if (b && b.kind === 'block' && !b.moving) {
      p.pushT += dt;
      if (p.pushT > 0.22) { tryPush(pdx, pdy, 7); p.pushT = 0; }
    } else p.pushT = 0;
  } else p.pushT = 0;

  // pickups
  for (const k of world.pickups) {
    if (k.t < 0.3) continue;
    if (Math.hypot(k.x - p.x, k.y - p.y) < 12) {
      k.taken = true;
      if (k.type === 'heart') { p.hp = Math.min(p.maxHp, p.hp + 2); floater(p.x, p.y - 18, '+1 heart', '#ff7a8a'); sfx('heal'); }
      else { p.shards++; sfx('pickup'); }
    }
  }
  checkExits();
}
function updateWorld(dt) {
  if (game.trans) { updateTrans(dt); return; }
  const w = world;
  w.time += dt;
  game.playTime += dt;
  updatePlayer(dt);
  if (game.state !== 'PLAYING' || game.trans) return; // dialogue / death / transition triggered this frame
  updateBlocks(dt);
  for (const e of w.enemies) updateEnemy(e, dt);
  separateEnemies();
  w.enemies = w.enemies.filter(e => !e.dead);
  // boss
  const b = w.boss;
  if (b) {
    if (b.state === 'dormant' && !player.dead && player.y < 247) {
      b.state = 'intro'; b.active = true;
      sfx('roar'); shake(0.6, 3);
      startDialogue(say('Morvath', "Another little light, wandering into my dark.",
        "The girl's voice will open the old door. And you... you will be its first echo.",
        "Come, then. Let the cavern remember your scream."), () => { b.state = 'walk'; b.cd = 1.0; });
      return;
    }
    updateBoss(b, dt);
  }
  // gates animate
  for (const g of w.gates) {
    const target = gateIsOpen(g) ? 1 : 0;
    if (g.open !== target) {
      const was = g.open;
      g.open = approach(g.open, target, dt * 1.6);
      if (was === 0 && target === 1) { burst(g.tx * 16 + 8, g.ty * 16 + 14, 6, '#4a4652', 40, 0.5, 1, 0); }
    }
  }
  // crystals
  for (const c of w.crystals) c.flash = Math.max(0, c.flash - dt);
  // projectiles
  for (const pr of w.projectiles) {
    pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.life -= dt;
    if (Math.random() < 0.5) w.particles.push({ x: pr.x, y: pr.y, vx: 0, vy: 0, life: 0.25, max: 0.25, c: '#7a2ab0', s: 2, g: 0 });
    if (tileSolidAt(pr.x, pr.y)) { pr.life = 0; burst(pr.x, pr.y, 5, '#9a3ad0', 40, 0.3, 1, 0); }
    else if (Math.hypot(pr.x - player.x, pr.y - (player.y - 4)) < pr.r + 5 && hurtPlayer(pr.dmg, pr.x, pr.y)) pr.life = 0;
  }
  w.projectiles = w.projectiles.filter(pr => pr.life > 0);
  // effects (shockwaves)
  for (const f of w.effects) {
    if (f.delay > 0) { f.delay -= dt; continue; }
    f.r += f.speed * dt;
    if (!f.hit && !player.dead) {
      const d = Math.hypot(player.x - f.x, player.y - f.y);
      if (Math.abs(d - f.r) < 7 && hurtPlayer(2, f.x, f.y)) f.hit = true;
    }
  }
  w.effects = w.effects.filter(f => f.r < f.max);
  // pickups
  for (const k of w.pickups) {
    k.t += dt;
    if (k.z < 0 || k.vy < 0) { k.vy += 300 * dt; k.z += k.vy * dt; if (k.z > 0) { k.z = 0; k.vy = 0; } }
    if (k.t > 14) k.taken = true;
  }
  w.pickups = w.pickups.filter(k => !k.taken);
  // NPC idle: look at player when near
  for (const n of w.npcs) {
    n.anim += dt;
    if (Math.hypot(player.x - n.x, player.y - n.y) < 40) faceToward(n); else if (n.kind !== 'mira') n.dir = 'down';
  }
  // camera
  const tx = clamp(player.x - VW / 2, 0, w.W * 16 - VW), ty = clamp(player.y - VH / 2, 0, w.H * 16 - VH);
  const k = 1 - Math.exp(-10 * dt);
  game.camX += (tx - game.camX) * k; game.camY += (ty - game.camY) * k;
  game.near = findInteract();
}
function updateFx(dt) {
  if (!world) return;
  for (const pt of world.particles) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += pt.g * dt; pt.vx *= 0.96; pt.life -= dt; }
  world.particles = world.particles.filter(pt => pt.life > 0);
  for (const f of world.floaters) f.t += dt;
  world.floaters = world.floaters.filter(f => f.t < 0.9);
}
function updateEmbers(dt) {
  if (game.embers.length < 70 && Math.random() < 0.6)
    game.embers.push({ x: Math.random() * VW, y: VH + 4, vx: rand(-6, 6), vy: rand(-28, -12), life: rand(4, 9), s: Math.random() < 0.2 ? 2 : 1 });
  for (const e of game.embers) { e.x += (e.vx + Math.sin(game.t * 2 + e.y * 0.05) * 6) * dt; e.y += e.vy * dt; e.life -= dt; }
  game.embers = game.embers.filter(e => e.life > 0 && e.y > -5);
}
function update(dt) {
  game.t += dt; game.stateT += dt;
  if (game.shakeT > 0) { game.shakeT -= dt; if (game.shakeT <= 0) game.shakeMag = 0; }
  if (game.banner) { game.banner.t += dt; if (game.banner.t > 3.2) game.banner = null; }
  for (const t of game.toasts) t.t += dt;
  game.toasts = game.toasts.filter(t => t.t < 4);
  switch (game.state) {
    case 'TITLE':
      updateEmbers(dt);
      if (kHit('Enter', 'NumpadEnter', 'Space')) { sfx('select'); newGame(); }
      break;
    case 'PLAYING':
      if (kHit('Escape', 'KeyP')) { pauseGame(); break; }
      updateWorld(dt); updateFx(dt);
      break;
    case 'DIALOGUE':
      updateDialogue(dt); updateFx(dt);
      break;
    case 'PAUSED':
      if (kHit('Escape', 'KeyP')) game.state = game.prevState || 'PLAYING';
      break;
    case 'GAME_OVER':
      updateFx(dt);
      if (game.stateT > 0.8 && kHit('Enter', 'NumpadEnter', 'Space', 'KeyE')) { sfx('select'); respawn(); }
      break;
    case 'VICTORY':
      updateEmbers(dt);
      if (game.stateT > 1.5 && kHit('Enter', 'NumpadEnter')) { sfx('select'); game.state = 'TITLE'; game.stateT = 0; }
      break;
  }
}

/* ===================== 11. RENDERING ===================== */
function text(str, x, y, size, color, align, outline) {
  ctx.font = 'bold ' + size + 'px "Courier New", Courier, monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  if (outline) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(1.2, size / 4); ctx.strokeStyle = outline; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function wrapText(str, maxW, size) {
  ctx.font = 'bold ' + size + 'px "Courier New", Courier, monospace';
  const words = str.split(' '), lines = [];
  let cur = '';
  for (const wd of words) {
    const test = cur ? cur + ' ' + wd : wd;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = wd; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function panel(x, y, w, h, alpha) {
  ctx.fillStyle = 'rgba(10,7,12,' + (alpha || 0.82) + ')'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#5a3a2a'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.strokeStyle = '#24160f'; ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
}

function collectLights() {
  const w = world, t = w.time, L = [];
  const p = player;
  L.push({ x: p.x, y: p.y - 6, r: w.def.playerLight + Math.sin(t * 3) * 2, i: 1 });
  for (const tc of w.torches) {
    const fl = Math.sin(t * 9 + tc.seed) * 3 + Math.sin(t * 23 + tc.seed * 2) * 2;
    L.push({ x: tc.x, y: tc.y, r: 66 + fl, i: 0.95, c: [255, 130, 40] });
  }
  for (const wd of w.windows) L.push({ x: wd.x, y: wd.y, r: 26, i: 0.55, c: [255, 170, 70] });
  for (const f of w.fonts) L.push({ x: f.x, y: f.y, r: 42 + Math.sin(t * 2) * 3, i: 0.8, c: [80, 160, 255] });
  for (const c of w.crystals) L.push({ x: c.tx * 16 + 8, y: c.ty * 16 + 6, r: c.lit ? 44 : 22, i: c.lit ? 0.9 : 0.5, c: CRYSTAL_COL[c.color][3] });
  for (const pl of w.plates) if (plateCovered(pl)) L.push({ x: pl.tx * 16 + 8, y: pl.ty * 16 + 8, r: 24, i: 0.6, c: [150, 110, 255] });

    const z = w.interact.find(it => it.label === 'Rune');

  for (const pr of w.projectiles) L.push({ x: pr.x, y: pr.y, r: 18, i: 0.8, c: [170, 60, 255] });

function drawLighting(cx, cy) {
  const amb = world.def.ambient;
  const L = collectLights();
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, VW, VH);
  lctx.fillStyle = 'rgba(4,3,9,' + amb + ')';
  lctx.fillRect(0, 0, VW, VH);
  lctx.globalCompositeOperation = 'destination-out';
  for (const l of L) {
    const x = l.x - cx, y = l.y - cy;
    if (x < -l.r || x > VW + l.r || y < -l.r || y > VH + l.r) continue;
    const g = lctx.createRadialGradient(x, y, 0, x, y, l.r);
    g.addColorStop(0, 'rgba(0,0,0,' + l.i + ')');
    g.addColorStop(0.5, 'rgba(0,0,0,' + (l.i * 0.6) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g;
    lctx.beginPath(); lctx.arc(x, y, l.r, 0, Math.PI * 2); lctx.fill();
  }
  lctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(lightCv, 0, 0, VW, VH);
  ctx.imageSmoothingEnabled = false;
  // coloured additive glow
  ctx.globalCompositeOperation = 'lighter';
  for (const l of L) {
    if (!l.c) continue;
    const x = l.x - cx, y = l.y - cy, r = l.r * 0.75;
    if (x < -r || x > VW + r || y < -r || y > VH + r) continue;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + l.c[0] + ',' + l.c[1] + ',' + l.c[2] + ',0.2)');
    g.addColorStop(1, 'rgba(' + l.c[0] + ',' + l.c[1] + ',' + l.c[2] + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(vigCv, 0, 0, VW, VH);
}

function drawAnimatedTiles(cx, cy) {
  const w = world, t = w.time;
  const x0 = Math.max(0, Math.floor(cx / 16)), y0 = Math.max(0, Math.floor(cy / 16));
  const x1 = Math.min(w.W - 1, x0 + 21), y1 = Math.min(w.H - 1, y0 + 16);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const ch = w.tiles[ty][tx], px = tx * 16, py = ty * 16;
    if (ch === '~') {
      const hsh = hash(tx, ty, 77);
      const off = Math.floor((t * 5 + hsh * 16) % 14);
      R(ctx, 'rgba(120,160,190,0.16)', px + off, py + 5 + Math.floor(hsh * 7), 3, 1);
    } else if (ch === 'F') {
      R(ctx, 'rgba(120,200,255,' + (0.25 + Math.sin(t * 3) * 0.1) + ')', px + 6, py + 7 + Math.round(Math.sin(t * 2)), 4, 1);
    } else if (ch === 'O') {
      const a = Q.bossDefeated ? 0.05 : 0.12 + Math.sin(t * 2 + tx + ty) * 0.08;
      R(ctx, 'rgba(200,20,40,' + a + ')', px, py, 16, 16);
    } else if (ch === 'Z' && !Q.seal1) {
      R(ctx, 'rgba(90,160,255,' + (0.15 + Math.sin(t * 3) * 0.1) + ')', px + 3, py + 3, 10, 10);
    }
  }
  // torch flames
  for (const tc of w.torches) {
    if (tc.x < cx - 16 || tc.x > cx + VW + 16 || tc.y < cy - 16 || tc.y > cy + VH + 16) continue;
    const fx = tc.x, fy = tc.y + 3;
    const f1 = Math.round(Math.sin(t * 14 + tc.seed) * 1), h = 4 + Math.round((Math.sin(t * 19 + tc.seed) + 1) * 1);
    R(ctx, '#8a2a14', fx - 3, fy - 2, 6, 3);
    R(ctx, '#ff7a24', fx - 2 + f1, fy - h, 4, h);
    R(ctx, '#ffd060', fx - 1 + f1, fy - h + 2, 2, h - 2);
    if (Math.random() < 0.04) w.particles.push({ x: fx, y: fy - h, vx: rand(-6, 6), vy: rand(-30, -15), life: 0.8, max: 0.8, c: '#ff9a40', s: 1, g: 0 });
  }
  // plates
  for (const pl of w.plates) {
    if (plateCovered(pl)) R(ctx, 'rgba(160,120,255,' + (0.3 + Math.sin(t * 4) * 0.1) + ')', pl.tx * 16 + 1, pl.ty * 16 + 1, 14, 14);
  }
}
function drawRitualCircle() {
  const m = world.mira; if (!m) return;
  const t = world.time, cx = m.x, cy = m.y - 2;
  const col = Q.bossDefeated ? 'rgba(130,180,255,0.35)' : 'rgba(220,30,50,' + (0.45 + Math.sin(t * 2) * 0.15) + ')';
  ctx.strokeStyle = col; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, 34, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i <= 5; i++) {
    const a = -Math.PI / 2 + t * 0.15 + i * (Math.PI * 4 / 5);
    const x = cx + Math.cos(a) * 28, y = cy + Math.sin(a) * 28;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}
function drawPlayer() {
  const p = player, t = world.time;
  if (p.dead) {
    const k = clamp(1 - p.deathT / 1.8, 0, 1);
    ctx.globalAlpha = 1 - k * 0.7;
    drawHumanoid(ctx, p.x, p.y + 5, Object.assign({}, PLAYER_PAL, { dir: 'down', moving: false, anim: 0 }));
    ctx.globalAlpha = 1;
    return;
  }
  if (p.blinkT > 0 && p.rollT <= 0 && Math.floor(t * 20) % 2 === 0) return;
  const swinging = p.atkT > 0;
  const prog = swinging ? 1 - p.atkT / 0.22 : 0;
  const ease = 1 - Math.pow(1 - prog, 2);
  const swingAng = p.atkAng - 1.25 + 2.5 * ease;
  const scx = p.x, scy = p.y - 5;
  if (p.rollT > 0) {
    FLASHC = Math.floor(t * 30) % 2 === 0 ? '#e8f0ff' : null;
    const f = FLASHC; FLASHC = null; oval(ctx, 'rgba(0,0,0,0.35)', Math.round(p.x), Math.round(p.y + 5), 5, 2); FLASHC = f;
    disc(ctx, PLAYER_PAL.cloak, Math.round(p.x), Math.round(p.y - 2), 5);
    disc(ctx, PLAYER_PAL.hair, Math.round(p.x), Math.round(p.y - 3), 3);
    const a = (0.3 - p.rollT) * 25;
    R(ctx, PLAYER_PAL.skin, Math.round(p.x + Math.cos(a) * 3), Math.round(p.y - 2 + Math.sin(a) * 3), 2, 2);
    FLASHC = null;
    return;
  }
  const behind = swinging && Math.sin(swingAng) < -0.2;
  if (swinging && behind) drawSword(ctx, scx, scy, swingAng, p.cursed);
  drawHumanoid(ctx, p.x, p.y + 5, Object.assign({}, PLAYER_PAL, { dir: p.dir, moving: p.moving, anim: p.anim }));
  if (swinging) {
    if (!behind) drawSword(ctx, scx, scy, swingAng, p.cursed);
    ctx.strokeStyle = p.cursed ? 'rgba(220,30,70,0.55)' : 'rgba(230,240,255,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(scx, scy, 17, p.atkAng - 1.25, swingAng); ctx.stroke();
    ctx.strokeStyle = p.cursed ? 'rgba(120,0,30,0.35)' : 'rgba(180,200,230,0.25)';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(scx, scy, 13, p.atkAng - 1.25, swingAng); ctx.stroke();
  } else {
    // sheathed hilt peeking over the shoulder
    if (p.dir !== 'up') R(ctx, p.cursed ? '#7a1020' : '#8a7a40', Math.round(p.x) + 4, Math.round(p.y) - 9, 1, 3);
  }
}
function drawEnemy(e) {

}
function drawBoss(b) {
  if (b.dead) return;
  const t = world.time;
  if (b.state === 'dying') ctx.globalAlpha = clamp(b.t / 2.2, 0, 1);
  // telegraphs
  if (b.state === 'chargeWind') {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.aimY, b.aimX));
    ctx.fillStyle = 'rgba(255,40,40,' + (0.15 + (Math.floor(t * 12) % 2) * 0.12) + ')';
    ctx.fillRect(0, -10, 150, 20);
    ctx.restore();

  if (b.state === 'slamWind') {
    ctx.strokeStyle = 'rgba(255,60,60,' + (0.3 + Math.sin(t * 30) * 0.2) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y + 4, 18 + (1 - b.t / 0.7) * 10, 0, Math.PI * 2); ctx.stroke();
  }
  const winding = b.state === 'chargeWind' || b.state === 'slamWind' || b.state === 'fanWind' || b.state === 'summon';
  if (b.flash > 0) FLASHC = '#ffffff';
  else if (winding && Math.floor(t * 14) % 2 === 0) FLASHC = '#ff3030';
  else if (b.state === 'transition' && Math.floor(t * 10) % 2 === 0) FLASHC = '#c050ff';
  drawBossSprite(ctx, b);
  FLASHC = null;
  if (b.state === 'stunned') {
    for (let i = 0; i < 3; i++) {
      const a = t * 5 + i * 2.1;
      R(ctx, '#ffd040', Math.round(b.x + Math.cos(a) * 9), Math.round(b.y - 48 + Math.sin(a) * 3), 2, 2);
    }
  }
  ctx.globalAlpha = 1;
}

function drawWorld() {
  const w = world;
  let cx = game.camX, cy = game.camY;
  if (game.shakeT > 0) { cx += rand(-1, 1) * game.shakeMag; cy += rand(-1, 1) * game.shakeMag; }
  cx = Math.round(clamp(cx, 0, w.W * 16 - VW)); cy = Math.round(clamp(cy, 0, w.H * 16 - VH));
  ctx.drawImage(w.layer, cx, cy, VW, VH, 0, 0, VW, VH);
  ctx.save();
  ctx.translate(-cx, -cy);
  drawAnimatedTiles(cx, cy);
  drawRitualCircle();
  for (const g of w.gates) drawGateTile(ctx, g);
  // shockwaves on the floor
  for (const f of w.effects) {
    if (f.delay > 0) continue;
    const a = clamp(1 - f.r / f.max, 0, 1);
    ctx.strokeStyle = 'rgba(190,80,255,' + (0.8 * a + 0.1) + ')'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r, f.r * 0.85, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,220,255,' + (0.5 * a) + ')'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r, f.r * 0.85, 0, 0, Math.PI * 2); ctx.stroke();
  }
  // y-sorted drawables
  const list = [];
  for (const b of w.blocks) {
    const bx = b.moving ? lerp(b.fromX, b.tx, b.t) : b.tx, by = b.moving ? lerp(b.fromY, b.ty, b.t) : b.ty;
    list.push({ y: by * 16 + 15, f: () => drawBlockSprite(ctx, Math.round(bx * 16), Math.round(by * 16), !b.moving && w.plates.some(pl => pl.tx === b.tx && pl.ty === b.ty)) });
  }
  for (const c of w.crystals) list.push({ y: c.ty * 16 + 14, f: () => drawCrystal(ctx, c, w.time) });
  if (w.remains) list.push({ y: w.remains.ty * 16 + 12, f: () => drawRemains(ctx, w.remains.tx, w.remains.ty, Q.hasKey) });
  for (const k of w.pickups) list.push({ y: k.y, f: () => drawPickup(k) });
  for (const n of w.npcs) list.push({ y: n.y + 5, f: () => n.kind === 'mira' ? drawMira(n) : drawHumanoid(ctx, n.x, n.y + 5, Object.assign({}, n.def.pal, { dir: n.dir, moving: false, anim: 0 })) });
  for (const e of w.enemies) list.push({ y: e.y + 4, f: () => drawEnemy(e) });
  if (w.boss) list.push({ y: w.boss.y + 8, f: () => drawBoss(w.boss) });
  list.push({ y: player.y + 5, f: drawPlayer });
  list.sort((a, b) => a.y - b.y);
  for (const d of list) d.f();
  // projectiles
  for (const pr of w.projectiles) {
    disc(ctx, '#2a0a3a', Math.round(pr.x), Math.round(pr.y), 3);
    disc(ctx, '#b050ff', Math.round(pr.x), Math.round(pr.y), 2);
    R(ctx, '#f0d0ff', Math.round(pr.x), Math.round(pr.y), 1, 1);
  }
  // particles
  for (const pt of w.particles) {
    ctx.globalAlpha = clamp(pt.life / pt.max, 0, 1);
    R(ctx, pt.c, Math.round(pt.x), Math.round(pt.y), pt.s, pt.s);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawLighting(cx, cy);

  // overlays above darkness: labels, prompts, numbers
  ctx.save();
  ctx.translate(-cx, -cy);
  for (const n of w.npcs) {
    if (Math.hypot(player.x - n.x, player.y - n.y) < 90) text(n.name, Math.round(n.x), Math.round(n.y) - 24, 5, '#e0c890', 'center', '#000');
  }
  if (game.near && game.state === 'PLAYING' && !player.dead) {
    const it = game.near;
    const bob = Math.round(Math.sin(world.time * 5));
    text('[E] ' + it.label, Math.round(it.x), Math.round(it.y) - 32 + bob, 5, '#ffffff', 'center', '#000');
  }
  for (const f of w.floaters) {
    ctx.globalAlpha = clamp(1.4 - f.t * 1.6, 0, 1);
    text(f.text, Math.round(f.x), Math.round(f.y - f.t * 26), 7, f.color, 'center', '#000');
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

  const stages = ['Speak with the Village Elder', 'Find the hunter Bren in the meadow', 'Unlock the cavern gate',
    'Enter the Forsaken Cavern', 'Break the stone & crystal seals', 'Defeat the master of the chamber', 'Free Mira'];
  for (let i = 0; i < stages.length; i++) {
    const done = Q.main > i, cur = Q.main === i;
    text((done ? '[x] ' : cur ? '[>] ' : '[ ] ') + stages[i], 40, 72 + i * 9, 6, done ? '#7a8a6a' : cur ? '#f0e0c0' : '#5a5a60');
  }
  text('Side: ' + sideQuestText(), 40, 72 + 7 * 9 + 4, 6, '#8ab070');
  text('Controls', VW / 2, 150, 7, '#d8a850', 'center');
  text('WASD / Arrows: move (8 directions)    J / Space: sword', VW / 2, 161, 5, '#c0b8a8', 'center');
  text('K / Shift: dodge roll (brief invulnerability)    E: talk, read, push', VW / 2, 169, 5, '#c0b8a8', 'center');
  text('Push stone blocks by walking into them.  P / Esc: pause', VW / 2, 177, 5, '#c0b8a8', 'center');
  if (Math.floor(game.t * 2) % 2 === 0) text('Press P or ESC to resume', VW / 2, 188, 6, '#ffffff', 'center');
}
function drawGameOver() {
  const a = clamp(game.stateT / 1.0, 0, 1);
  R(ctx, 'rgba(30,0,4,' + (0.75 * a) + ')', 0, 0, VW, VH);
  ctx.globalAlpha = a;
  text('YOU HAVE FALLEN', VW / 2, 80, 18, '#c8202a', 'center', '#000');
  text('The dark keeps what it takes... but not you. Not yet.', VW / 2, 108, 6, '#c0a8a0', 'center');
  text('Your quest progress endures.', VW / 2, 118, 6, '#8a7a70', 'center');
  if (game.stateT > 0.8 && Math.floor(game.t * 2) % 2 === 0) text('Press ENTER to rise again in the Ashen Village', VW / 2, 146, 7, '#ffffff', 'center', '#000');
  ctx.globalAlpha = 1;
}
function drawBackdrop(tint) {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#050408'); g.addColorStop(0.6, tint); g.addColorStop(1, '#060406');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  // blood moon
  disc(ctx, '#3a0e10', 250, 50, 18); disc(ctx, '#4a1416', 248, 48, 15); R(ctx, '#5a1a1a', 242, 42, 4, 2);
  // mountains
  ctx.fillStyle = '#0c0a10';
  ctx.beginPath(); ctx.moveTo(0, 170);
  for (let x = 0; x <= VW; x += 8) ctx.lineTo(x, 150 - Math.abs(Math.sin(x * 0.021) * 40) - Math.sin(x * 0.07) * 6);
  ctx.lineTo(VW, VH); ctx.lineTo(0, VH); ctx.fill();
  // cave mouth glow
  const cg = ctx.createRadialGradient(160, 168, 2, 160, 168, 40);
  cg.addColorStop(0, 'rgba(160,30,40,0.35)'); cg.addColorStop(1, 'rgba(160,30,40,0)');
  ctx.fillStyle = cg; ctx.fillRect(110, 120, 100, 90);
  ctx.fillStyle = '#020103'; ctx.beginPath(); ctx.ellipse(160, 172, 14, 12, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(146, 172, 28, 6);
  // ground + dead trees
  R(ctx, '#070608', 0, 178, VW, VH - 178);
  const trees = [20, 60, 92, 228, 270, 302];
  for (const tx of trees) {
    R(ctx, '#050406', tx, 140, 3, 40);
    R(ctx, '#050406', tx - 6, 150, 7, 2); R(ctx, '#050406', tx - 7, 146, 2, 5);
    R(ctx, '#050406', tx + 3, 156, 7, 2); R(ctx, '#050406', tx + 9, 151, 2, 6);
    R(ctx, '#050406', tx + 1, 134, 1, 7);
  }
  for (const e of game.embers) {
    ctx.globalAlpha = clamp(e.life / 3, 0, 1);
    R(ctx, e.s > 1 ? '#ffb040' : '#ff6a20', Math.round(e.x), Math.round(e.y), e.s, e.s);
  }
  ctx.globalAlpha = 1;
}
function drawTitle() {
  drawBackdrop('#16080c');
  const fl = 0.85 + Math.sin(game.t * 7) * 0.08 + Math.random() * 0.05;
  ctx.globalAlpha = fl;
  text('ECHOES', VW / 2 + 1, 37, 26, '#000', 'center');
  text('ECHOES', VW / 2, 36, 26, '#b0202a', 'center');
  text('IN THE DARK', VW / 2 + 1, 67, 16, '#000', 'center');
  text('IN THE DARK', VW / 2, 66, 16, '#c8b090', 'center');
  ctx.globalAlpha = 1;
  text('A tale of the Ashen Village', VW / 2, 88, 7, '#8a7a6a', 'center');
  if (Math.floor(game.t * 2) % 2 === 0) text('Press ENTER to begin', VW / 2, 192, 9, '#ffffff', 'center', '#000');
  text('WASD/Arrows move  ·  J/Space attack  ·  K/Shift roll  ·  E interact  ·  P pause', VW / 2, 214, 5, '#9a8a80', 'center', '#000');
  text('Headphones recommended. Sound starts after your first key press.', VW / 2, 224, 5, '#5a5050', 'center');
}
function drawVictory() {
  drawBackdrop('#0a1018');
  const a = clamp(game.stateT / 1.5, 0, 1);
  ctx.globalAlpha = a;
  text('VICTORY', VW / 2, 22, 22, '#d8c090', 'center', '#000');
  text('The echoes fade. Mira is free.', VW / 2, 52, 8, '#c0d0e0', 'center', '#000');
  text('Together you climb out of the Forsaken Cavern, into a grey dawn.', VW / 2, 66, 6, '#a0a8b0', 'center', '#000');
  text('Somewhere behind you, the dark falls silent at last.', VW / 2, 75, 6, '#a0a8b0', 'center', '#000');
  panel(80, 90, 160, 62, 0.8);
  const tsec = Math.floor(game.playTime), mm = Math.floor(tsec / 60), ss = tsec % 60;
  text('Time: ' + mm + ':' + (ss < 10 ? '0' : '') + ss, 92, 98, 7, '#e8e0d0');
  text('Foes slain: ' + player.kills, 92, 109, 7, '#e8e0d0');
  text('Soul shards: ' + player.shards, 92, 120, 7, '#b8a8e8');
  text("Farmer's Plight: " + (Q.side === 3 ? 'Complete' : 'Unfinished'), 92, 131, 7, Q.side === 3 ? '#8ab070' : '#8a7a70');
  text('Blade: ' + (player.cursed ? 'Cursed Blade' : 'Iron Sword'), 92, 142, 6, player.cursed ? '#ff5a7a' : '#c0c0c8');
  if (game.stateT > 1.5 && Math.floor(game.t * 2) % 2 === 0) text('Press ENTER to return to the title', VW / 2, 192, 8, '#ffffff', 'center', '#000');
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  if (game.state === 'TITLE') { drawTitle(); return; }
  if (game.state === 'VICTORY') { drawVictory(); return; }
  if (!world) return;
  drawWorld();
  drawHUD();
  if (game.state === 'DIALOGUE' || (game.state === 'PAUSED' && game.prevState === 'DIALOGUE')) drawDialogue();
  if (game.trans) {
    const tr = game.trans, a = tr.phase === 'out' ? clamp(tr.t / 0.3, 0, 1) : clamp(1 - tr.t / 0.3, 0, 1);
    R(ctx, 'rgba(0,0,0,' + a + ')', 0, 0, VW, VH);
  }
  if (game.state === 'GAME_OVER') drawGameOver();
  if (game.state === 'PAUSED') drawPause();
}

/* ===================== 12. BOOT ===================== */
let lastTime = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!(dt >= 0)) dt = 0;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  while (acc >= STEP) {
    update(STEP);
    clearPressed();
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}
canvas.focus();
requestAnimationFrame(frame);
</script>
