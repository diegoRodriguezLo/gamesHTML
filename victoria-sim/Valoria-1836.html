  h += '<table><tr><th>Mercancía</th><th class="num">Precio</th><th class="num"' + tip('Precio de referencia histórico') + '>Base</th><th class="num"' + tip('Precio en el mercado mundial (fluctúa aleatoriamente)') + '>Mundial</th><th class="num">Oferta</th><th class="num">Demanda</th><th class="num">Comercio</th><th' + tip('Proporción de la demanda que se pudo satisfacer') + '>Cobertura</th></tr>';
  for (const g of GOOD_IDS) {
    const m = M[g], G = GOODS[g];
    if (!avail(g)) { h += '<tr class="locked"><td>' + G.ic + ' ' + G.n + '</td><td colspan="7" class="muted small">Requiere la tecnología «' + TECHS[G.tech].n + '»</td></tr>'; continue; }
    const r = m.price / G.base; const pc = r > 1.25 ? 'neg' : r < 0.8 ? 'pos' : '';
    const dTip = '<b>Demanda de ' + G.n.toLowerCase() + '</b><br>Población: ' + fmt(m.dPop, 1) + '<br>Industria (insumos): ' + fmt(m.dIn, 1) + '<br>Estado: ' + fmt(m.dGov, 1) + '<br>Construcción: ' + fmt(m.dCon, 1);
    const tr = m.imp > 0.05 ? '<span class="neg"' + tip('Importación') + '>▼ ' + fmt(m.imp, 1) + '</span>' : m.exp > 0.05 ? '<span class="pos"' + tip('Exportación') + '>▲ ' + fmt(m.exp, 1) + '</span>' : '<span class="faint">—</span>';
    h += '<tr><td>' + G.ic + ' ' + G.n + '</td><td class="num ' + pc + '">' + fmt(m.price, 1) + '</td><td class="num faint">' + G.base + '</td><td class="num muted">' + fmt(m.world, 1) + '</td><td class="num">' + fmt(m.supply, 1) + '</td><td class="num"' + tip(dTip) + '>' + fmt(m.demand, 1) + '</td><td class="num">' + tr + '</td><td style="min-width:90px">' + bar(m.fill, m.fill < 0.9 ? 'red' : 'green') + '</td></tr>';
  }
  h += '</table></div>';
  // Edificios
  const cats = [['agri', 'Agricultura'], ['ext', 'Extracción'], ['ind', 'Industria'], ['serv', 'Servicios y Estado']];
  h += '<div class="card mt"><div class="between"><h3' + tip('Los edificios privados se pagan primero con la capacidad de inversión privada y el resto con el tesoro. Los estatales, solo con el tesoro, y además cuestan sueldos e insumos cada mes.') + '>Edificios</h3><span class="small muted">Inversión privada: <span class="gold">' + money(S.pool) + '</span> · Tesoro: <span class="gold">' + money(S.treasury) + '</span> · Velocidad de obra: ' + pct(constructionSpeed()) + ' · Obras simultáneas: ' + constructionSlots() + '</span></div>';
  h += '<table><tr><th>Edificio</th><th class="num">Niveles</th><th' + tip('Proporción de puestos cubiertos por trabajadores') + '>Plantilla</th><th class="num"' + tip('Eficiencia real: plantilla × disponibilidad de insumos × productividad tecnológica') + '>Rendimiento</th><th class="num"' + tip('Beneficio mensual por nivel para los propietarios (o coste para el Estado)') + '>Resultado/nivel</th><th class="num"' + tip('Salario medio mensual por cada 1.000 trabajadores') + '>Salario</th><th class="num">Coste</th><th></th></tr>';
  for (const [cat, cn] of cats) {
    h += '<tr><td colspan="8" class="serif gold" style="padding-top:10px">' + cn + '</td></tr>';
    for (const id of BUILDING_IDS) {
      const b = BUILDINGS[id]; if (b.cat !== cat) continue;
      const B = S.bld[id], lk = buildingLocked(id), q = queuedCount(id);
      if (b.auto) {
        h += '<tr><td' + tip(buildingTip(id)) + '>' + b.ic + ' ' + b.n + '</td><td class="num">' + B.level + '</td><td colspan="2" class="small muted">' + fmt(S.pops.campesinos.pop - (S.jobs.campesinos || 0)) + ' mil campesinos</td><td class="num small muted">—</td><td class="num">' + fmt(S.pops.campesinos.income / Math.max(1, S.pops.campesinos.pop), 1) + '</td><td class="num small muted">automático</td><td></td></tr>';
        continue;
      }
      const cb = canBuild(id); const c = buildCost(id);
      const res = B.level > 0 ? B.profit / B.level : 0;
      const costTip = '<b>Coste: ' + money(c.total) + '</b><br>Dinero: ' + money(c.money) + '<br>Materiales (a precio actual): ' + money(c.goods) + (b.state ? '<br>Se paga con el <b>tesoro</b>.' : '<br>Se paga con la <b>inversión privada</b> (' + money(S.pool) + ') y el resto con el tesoro.') + (cb.ok ? '' : '<br><span class="neg">' + esc(cb.why) + '</span>');
      h += '<tr class="' + (lk ? 'locked' : '') + '"><td' + tip(buildingTip(id)) + '>' + b.ic + ' ' + b.n + (b.state ? ' <span class="tag">Estado</span>' : '') + '</td>' +
        '<td class="num">' + B.level + '<span class="faint">/' + b.max + '</span>' + (q ? ' <span class="tag gold"' + tip(q + ' en construcción o en cola') + '>+' + q + '</span>' : '') + '</td>' +
        '<td style="min-width:70px">' + (B.level ? bar(B.staff, B.staff < 0.9 ? 'red' : 'green') : '<span class="faint">—</span>') + '</td>' +
        '<td class="num">' + (B.level ? pct(B.eff * (B.pm || 1)) : '—') + '</td>' +
        '<td class="num">' + (B.level ? signed(res, '') : '<span class="faint">—</span>') + '</td>' +
        '<td class="num muted">' + (B.level && B.wagePer ? fmt(B.wagePer, 1) : B.level && b.state ? fmt(S.wages[Object.keys(b.work)[0]] || 0, 1) : '—') + '</td>' +
        '<td class="num"' + tip(costTip) + '>' + (lk ? '<span class="faint">🔒 ' + esc(TECHS[b.tech].n) + '</span>' : money(c.total)) + '</td>' +
        '<td class="right" style="white-space:nowrap"><button class="btn sm primary" data-act="build" data-arg="' + id + '"' + (cb.ok ? '' : ' aria-disabled="true"') + tip(cb.ok ? 'Construir un nivel más' + (cb.fromPool ? ' (' + money(cb.fromPool) + ' de inversión privada' + (cb.fromTreasury ? ' + ' + money(cb.fromTreasury) + ' del tesoro' : '') + ')' : ' (' + money(cb.fromTreasury) + ' del tesoro)') : cb.why) + '>＋ Construir</button> ' +
        '<button class="btn sm" data-act="demolish" data-arg="' + id + '"' + (B.level > 0 ? '' : ' aria-disabled="true"') + tip('Demoler un nivel (sin reembolso). Útil si el edificio da pérdidas.') + '>－</button></td></tr>';
    }
  }
  h += '</table></div>';
  // Cola
  h += '<div class="card mt"><h3' + tip('Las primeras obras de la cola avanzan a la vez (según las obras simultáneas). Cada obra consume materiales del mercado mientras avanza.') + '>Obras en construcción</h3>';
  if (!S.queue.length) h += '<p class="muted">No hay obras en marcha.</p>';
  else {
    const slots = constructionSlots();
    h += '<table><tr><th>#</th><th>Edificio</th><th>Progreso</th><th class="num">Meses restantes</th><th></th></tr>' + S.queue.map((q, i) => {
      const b = BUILDINGS[q.id], frac = q.prog / b.months, rem = Math.max(0, Math.ceil((b.months - q.prog) / constructionSpeed()));
      return '<tr><td>' + (i + 1) + '</td><td>' + b.ic + ' ' + b.n + (i >= slots ? ' <span class="tag">en espera</span>' : '') + '</td><td style="min-width:140px">' + bar(frac, 'blue') + '</td><td class="num">' + (i >= slots ? '—' : rem) + '</td><td class="right"><button class="btn sm danger" data-act="cancel" data-arg="' + i + '"' + tip('Cancelar la obra y recuperar parte del coste en el tesoro') + '>✕</button></td></tr>';
    }).join('') + '</table>';
  }
  h += '</div>';
  return h;
}

/* ---------- Población ---------- */
function viewPoblacion() {
  const P = S.pops, tp = totalPop();
  let h = '<h2>Población</h2>';
  h += '<div class="card"><div class="grid g4">' +
    '<div class="kpi"' + tip('Población total en miles de habitantes.') + '><span class="l">Habitantes</span><span class="v">' + fmt(tp) + ' mil</span></div>' +
    '<div class="kpi"' + tip('Inmigración neta al año (miles). Positiva si el nivel de vida medio supera 42; negativa si baja de 30.') + '><span class="l">Migración neta</span><span class="v">' + signed((S.migration || 0) * 12, ' mil/año') + '</span></div>' +
    '<div class="kpi"' + tip('Nivel de vida medio ponderado por población.') + '><span class="l">Nivel de vida medio</span><span class="v">' + fmt(S.avgSol || 0, 1) + '</span></div>' +
    '<div class="kpi"' + tip('Las expectativas de todas las clases suben con la alfabetización: un pueblo educado exige más.') + '><span class="l">Alfabetización</span><span class="v">' + pct(S.literacy, 1) + '</span></div>' +
    '</div></div>';
  h += '<div class="grid gauto mt">';
  for (const c of CLASS_IDS) {
    const p = P[c], cl = CLASSES[c];
    const expv = cl.exp + S.literacy * 20;
    const tierTip = NEEDS.map((n, i) => n.n + ': ' + pct(p.tiers[i] || 0)).join('<br>');
    h += '<div class="card popcard"><div class="head"><span class="ic">' + cl.ic + '</span><div><h3' + tip('<b>' + cl.n + '</b><br>' + cl.desc) + '>' + cl.n + '</h3><span class="small muted">' + fmt(p.pop, 1) + ' mil · ' + pct(p.pop / tp, 1) + ' ' + signed((p.growth || 0) * 12, ' mil/año') + '</span></div></div>';
    h += '<div class="kv">' +
      '<span' + tip('Renta neta mensual por cada 1.000 habitantes de la clase (tras impuestos, diezmo y con sueldos públicos y ayudas).') + '>Renta /1.000 hab.</span><span>' + fmt(netPC(c), 1) + ' £</span>' +
      '<span' + tip('Ahorros acumulados de toda la clase.') + '>Riqueza</span><span>' + money(p.wealth) + '</span>' +
      '<span' + tip('Peso político de la clase según el censo electoral vigente.') + '>Poder político</span><span>' + pct(S.power[c] || 0, 1) + '</span>' +
      '<span' + tip('Impuesto sobre la renta de esta clase (se cambia en Presupuesto).') + '>Impuesto</span><span>' + TAX_LEVELS[S.taxes[c]].n + '</span>' +
      (c === 'obreros' ? '<span' + tip('Obreros sin puesto de trabajo. Si no hay empleo, vuelven poco a poco al campo.') + '>Desempleados</span><span class="' + (p.unemp > p.pop * 0.1 ? 'neg' : '') + '">' + fmt(p.unemp, 1) + ' mil</span>' : '') +
      '<span' + tip('Fracción de la clase con ideas radicales.') + '>Radicales</span><span class="' + (p.radical > 0.2 ? 'neg' : '') + '">' + pct(p.radical, 0) + '</span>' +
      '</div>';
    h += '<div class="mt small"' + tip('<b>Nivel de vida</b>: ' + fmt(p.sol, 1) + '<br>' + tierTip + '<br>La marca blanca indica sus expectativas (' + fmt(expv) + ').') + '><div class="between"><span>Nivel de vida</span><span>' + fmt(p.sol) + '</span></div>' + bar(p.sol / 100, 'blue', expv / 100) + '</div>';
    h += '<div class="small" style="margin-top:6px"' + tip('<b>Satisfacción</b>: depende del nivel de vida frente a sus expectativas, los impuestos, las leyes, el gasto público y los eventos. Por debajo de 40 aparecen radicales.') + '><div class="between"><span>Satisfacción</span><span class="' + satClass(p.sat) + '">' + fmt(p.sat) + '</span></div>' + bar(p.sat / 100, satBarCls(p.sat), 0.4) + '</div>';
    h += '<div class="row small" style="margin-top:6px;gap:4px"' + tip('Cobertura de cada nivel de necesidades: subsistencia, básicas, confort y lujo.') + '>' + NEEDS.map((n, i) => '<div style="flex:1">' + bar(p.tiers[i] || 0, i === 0 && (p.tiers[0] || 0) < 0.7 ? 'red' : 'green') + '</div>').join('') + '</div>';
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="card mt"><h3' + tip('Cada clase intenta comprar por orden: primero la subsistencia, luego las necesidades básicas, después el confort y por último el lujo. Las cantidades son por cada 1.000 habitantes y se multiplican por el factor de consumo de la clase.') + '>Jerarquía de necesidades</h3><table><tr><th>Nivel</th><th class="num">Peso</th><th>Mercancías (por 1.000 hab./mes)</th></tr>' +
    NEEDS.map(n => '<tr><td>' + n.n + '</td><td class="num">' + n.w + '</td><td class="small">' + Object.keys(n.g).map(g => GOODS[g].ic + ' ' + GOODS[g].n + ' ' + fmt(n.g[g], 3) + (avail(g) ? '' : ' <span class="faint">(no disponible)</span>')).join(' · ') + '</td></tr>').join('') +
    '</table><p class="small muted">Factor de consumo: ' + CLASS_IDS.map(c => CLASSES[c].n + ' ×' + fmt(CLASSES[c].mult, 1)).join(' · ') + '</p></div>';
  return h;
}

/* ---------- Política ---------- */
function viewPolitica() {
  let h = '<h2>Política</h2>';
  h += '<div class="grid g3"><div class="card kpi"' + tip('Satisfacción media ponderada por el poder político. Una estabilidad baja reduce la recaudación.') + '><span class="l">Estabilidad</span><span class="v">' + fmt(S.stability) + '/100</span>' + bar(S.stability / 100, satBarCls(S.stability)) + '</div>' +
    '<div class="card kpi"' + tip('Si llega al 100%, la revolución derroca al gobierno y pierdes la partida. Sube cuando más del 15% de la población es radical; la reprimen un ejército leal y el bienestar.') + '><span class="l">Tensión revolucionaria</span><span class="v ' + (S.tension > 60 ? 'neg' : '') + '">' + fmt(S.tension) + '% <span class="small">(' + (S.tensionDelta >= 0 ? '+' : '') + fmt(S.tensionDelta || 0, 1) + '/mes)</span></span>' + bar(S.tension / 100, 'red') + '</div>' +
    '<div class="card kpi"' + tip('Tras aprobar una ley, el parlamento necesita 12 meses antes de la siguiente reforma.') + '><span class="l">Próxima reforma</span><span class="v">' + (S.lawCooldown > 0 ? 'en ' + S.lawCooldown + ' meses' : 'Disponible') + '</span><span class="s">Radicales: ' + pct(S.radicals || 0, 1) + ' de la población</span></div></div>';
  // Leyes
  h += '<div class="card mt"><h3' + tip('Para aprobar una ley, el poder de los grupos que la apoyan debe ser al menos el 80% del poder de los que se oponen. Los grupos perjudicados se enfadarán durante 2 años.') + '>Leyes</h3><div class="grid g2">';
  for (const l of LAW_IDS) {
    const L = LAWS[l];
    h += '<div style="padding:8px 0;border-bottom:1px solid rgba(74,62,38,.5)"><div class="between"><b class="serif gold"' + tip(L.tip) + '>' + L.n + '</b><span class="small muted">' + L.opts[S.laws[l]].n + '</span></div><div class="lawopts">';
    for (const o in L.opts) {
      const O = L.opts[o], on = S.laws[l] === o;
      const ce = on ? { ok: false } : canEnact(l, o);
      const sp = on ? null : lawSupport(l, o);
      const stance = GROUP_IDS.map((g, gi) => { const v = O.st[gi]; return GROUPS[g].ic + ' ' + GROUPS[g].n + ': <span class="' + (v > 0 ? 'pos' : v < 0 ? 'neg' : 'muted') + '">' + (v > 0 ? '+' : '') + v + '</span>'; }).join('<br>');
      const t = '<b>' + O.n + '</b><br>' + O.d + '<br><br>Postura de los grupos:<br>' + stance + (sp ? '<br><br>Apoyo (por poder): <span class="pos">' + pct(sp.pro) + '</span> · Oposición: <span class="neg">' + pct(sp.contra) + '</span>' : '') + (!on && !ce.ok ? '<br><span class="neg">' + esc(ce.why) + '</span>' : '') + (on ? '<br><span class="gold">En vigor</span>' : '');
      h += '<button class="lawopt ' + (on ? 'on' : '') + '" data-act="law" data-arg="' + l + '|' + o + '"' + (on || !ce.ok ? ' aria-disabled="true"' : '') + tip(t) + '>' + (O.tech && !S.techs[O.tech] ? '🔒 ' : '') + O.n + '</button>';
    }
    h += '</div></div>';
  }
  h += '</div></div>';
  // Grupos de interés
  h += '<h3 class="mt">Grupos de interés</h3><div class="grid g3">';
  GROUP_IDS.forEach((g, gi) => {
    const G = GROUPS[g], sat = S.groupSat[g] || 0, pw = S.groupPower[g] || 0;
    let lawSt = 0; const likes = [], hates = [];
    for (const l of LAW_IDS) { const v = LAWS[l].opts[S.laws[l]].st[gi]; lawSt += v; if (v > 0) likes.push(LAWS[l].opts[S.laws[l]].n); if (v < 0) hates.push(LAWS[l].opts[S.laws[l]].n); }
    const mem = Object.keys(G.mem).map(c => CLASSES[c].n + (G.mem[c] < 1 ? ' (' + pct(G.mem[c]) + ')' : '')).join(', ');
    let rad = 0, popT = 0; for (const c in G.mem) { rad += S.pops[c].radical * S.pops[c].pop * G.mem[c]; popT += S.pops[c].pop * G.mem[c]; }
    const mood = sat >= 60 ? 'Leal' : sat >= 40 ? 'Neutral' : sat >= 25 ? 'Descontento' : 'Furioso';
    h += '<div class="card"><div class="between"><h3 style="margin:0;color:' + G.color + '"' + tip('Miembros: ' + mem) + '>' + G.ic + ' ' + G.n + '</h3><span class="tag ' + (sat >= 60 ? 'good' : sat < 40 ? 'bad' : '') + '">' + mood + '</span></div>' +
      '<div class="small mt"' + tip('Peso político del grupo (suma del poder de sus clases).') + '><div class="between"><span>Poder político</span><span>' + pct(pw, 1) + '</span></div>' + bar(pw, 'blue') + '</div>' +
      '<div class="small" style="margin-top:6px"' + tip('Satisfacción media de sus miembros. Por debajo de 40 surgen radicales; si el ejército está furioso, puede dar un golpe de Estado.') + '><div class="between"><span>Satisfacción</span><span class="' + satClass(sat) + '">' + fmt(sat) + '</span></div>' + bar(sat / 100, satBarCls(sat), 0.4) + '</div>' +
      '<div class="small" style="margin-top:6px"><span class="muted">Radicales:</span> ' + pct(popT ? rad / popT : 0) + ' · <span class="muted">Postura ante las leyes:</span> <span class="' + (lawSt > 0 ? 'pos' : lawSt < 0 ? 'neg' : '') + '">' + (lawSt > 0 ? '+' : '') + lawSt + '</span></div>' +
      '<div class="small faint" style="margin-top:4px">' + (likes.length ? '👍 ' + esc(likes.join(', ')) : '') + (hates.length ? '<br>👎 ' + esc(hates.join(', ')) : '') + '</div></div>';
  });
  h += '</div>';
  // Modificadores activos
  const mods = S.mods.filter(m => m.key === 'sat' && m.label);
  if (mods.length) {
    const agg = {};
    mods.forEach(m => { const k = m.label + '|' + (m.cls || 'todos'); agg[k] = agg[k] || { l: m.label, c: m.cls, v: 0, mo: 0 }; agg[k].v += m.val; agg[k].mo = Math.max(agg[k].mo, m.months); });
    h += '<div class="card mt"><h3>Efectos temporales sobre la satisfacción</h3><table><tr><th>Causa</th><th>Clase</th><th class="num">Efecto</th><th class="num">Meses</th></tr>' +
      Object.values(agg).map(a => '<tr><td>' + esc(a.l) + '</td><td>' + (a.c ? CLASSES[a.c].n : 'Todas') + '</td><td class="num ' + (a.v > 0 ? 'pos' : 'neg') + '">' + (a.v > 0 ? '+' : '') + fmt(a.v) + '</td><td class="num">' + a.mo + '</td></tr>').join('') + '</table></div>';
  }
  return h;
}

/* ---------- Investigación ---------- */
function viewInvestigacion() {
  const R = S.research, rp = S.rp || researchPoints();
  let h = '<h2>Investigación</h2><div class="card"><div class="between"><div>';
  if (R.cur) {
    const t = TECHS[R.cur], pr = R.prog[R.cur] || 0;
    h += '<h3 style="margin:0">Investigando: ' + t.n + '</h3><div class="small muted">' + fmt(pr) + ' / ' + t.cost + ' puntos · faltan unos ' + Math.ceil((t.cost - pr) / Math.max(0.1, rp)) + ' meses</div></div><div style="width:40%">' + bar(pr / t.cost, 'blue tall') + '</div>';
  } else h += '<h3 style="margin:0" class="warn">No hay investigación en curso</h3><div class="small muted">Haz clic en una tecnología disponible. Los puntos se acumulan (hasta 150) mientras tanto: ' + fmt(R.bank || 0) + '.</div></div>';
  h += '</div><p class="small muted"' + tip('Base 3 + alfabetización × 12 + 2,5 por universidad (con plantilla) · +10% con Imprenta rotativa.') + '>Puntos de investigación: <b class="gold">' + fmt(rp, 1) + '</b> al mes. Tecnologías: ' + Object.keys(S.techs).length + ' / ' + TECH_IDS.length + '.</p></div>';
  h += '<div class="grid g3 mt">';
  for (const br in BRANCHES) {
    h += '<div class="card"><h3>' + BRANCHES[br] + '</h3>';
    TECH_IDS.filter(id => TECHS[id].b === br).sort((a, b) => TECHS[a].cost - TECHS[b].cost).forEach(id => {
      const t = TECHS[id], done = !!S.techs[id], av = techAvailable(id), cur = R.cur === id, pr = R.prog[id] || 0;
      const cls = done ? 'done' : cur ? 'cur' : av ? '' : 'lock';
      const reqs = t.req.map(r => (S.techs[r] ? '✔ ' : '✘ ') + TECHS[r].n).join(', ');
      h += '<div class="tech ' + cls + '"' + (av && !cur ? ' data-act="research" data-arg="' + id + '"' : '') + tip('<b>' + t.n + '</b><br>' + t.d + '<br>Coste: ' + t.cost + ' puntos (≈' + Math.ceil(Math.max(0, t.cost - pr) / Math.max(0.1, rp)) + ' meses)' + (reqs ? '<br>Requiere: ' + reqs : '') + (av && !cur ? '<br><span class="gold">Clic para investigar</span>' : '')) + '>' +
        '<div class="between"><span class="tn">' + (done ? '✔ ' : !av ? '🔒 ' : '') + t.n + '</span><span class="small muted">' + t.cost + '</span></div><div class="td">' + t.d + '</div>' +
        (done ? '' : bar(pr / t.cost, 'blue')) + '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

/* ---------- Presupuesto ---------- */
function viewPresupuesto() {
  const B = S.budget; if (!B) return '<p>Sin datos aún.</p>';
  const eff = B.taxEff;

}

/* =====================================================================
   Sección 12: GUARDADO
   ===================================================================== */
function saveSlot(k) {
  try { S.savedAt = new Date().toLocaleString('es-ES'); localStorage.setItem('valoria_save_' + k, JSON.stringify(S)); return true; }
  catch (e) { return false; }
}
function loadSlot(k) {
  try {
    const raw = localStorage.getItem('valoria_save_' + k); if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !d.pops || !d.market || !d.bld) return false;
    const fresh = newGame();
    S = Object.assign(fresh, d);
    for (const id of BUILDING_IDS) if (!S.bld[id]) S.bld[id] = { level: 0, eff: 0, staff: 0, profit: 0, revenue: 0, pm: 1 };
    return true;
  } catch (e) { return false; }
}

/* =====================================================================
   Sección 13: BUCLE DE JUEGO Y CONTROLES
   ===================================================================== */
function setSpeed(n) {
  if (n > 0) UI.prevSpeed = n;
  UI.speed = n; schedule(); renderTop();
}
function schedule() {
  clearTimeout(UI.timer);
  if (UI.speed > 0) UI.timer = setTimeout(stepLoop, SPEEDS[UI.speed]);
}
function stepLoop() {
  if (!UI.modal && !S.gameOver && !S.pendingEvent) {
    try { tick(); } catch (e) { console.warn('Error en la simulación:', e); }
    afterTick();
  }
  schedule();
}
function afterTick() {
  if (S.month > 0 && S.month % 12 === 0 && !S.gameOver) { if (saveSlot('auto')) toast('Autoguardado: ' + dateStr()); }
  renderTop(); renderTabs();
  if (!UI.mouseDown && !UI.modal) renderPanel();
  if (S.gameOver) { UI.speed = 0; renderTop(); showGameOver(); }
  else if (S.pendingEvent) showEvent();
}
function act(a, arg, el) {
  switch (a) {
    case 'tab': UI.tab = arg; renderTabs(); $('#panel').scrollTop = 0; renderPanel(); break;
    case 'speed': setSpeed(+arg); break;
    case 'help': showHelp(); break;
    case 'close': closeModal(); renderAll(); if (S.gameOver) showGameOver(); else if (S.pendingEvent) showEvent(); break;
    case 'savemenu': showSaveLoad('save'); break;
    case 'loadmenu': showSaveLoad('load'); break;
    case 'slotsave': if (saveSlot(arg)) { toast('Partida guardada en la ranura ' + arg); closeModal(); } else toast('No se pudo guardar (almacenamiento no disponible).'); break;
    case 'slotload': if (loadSlot(arg)) { closeModal(); UI.speed = 0; renderAll(); toast('Partida cargada: ' + dateStr()); if (S.pendingEvent) showEvent(); else if (S.gameOver) showGameOver(); } else toast('No se pudo cargar la partida.'); break;
    case 'slotdel': try { localStorage.removeItem('valoria_save_' + arg); } catch (e) { /* sin almacenamiento */ } showSaveLoad(UI.lastSL || 'load'); break;
    case 'newgame': confirmBox('Se perderá la partida actual si no la has guardado.', 'newgame-now'); break;
    case 'newgame-now': newGame(); closeModal(); UI.speed = 0; UI.tab = 'resumen'; renderAll(); toast('Nueva partida: enero de 1836'); break;
    case 'evopt': resolveEvent(+arg); closeModal(); renderAll(); if (S.pendingEvent) showEvent(); break;
    case 'build': { const r = build(arg); if (r.ok) toast('Obra iniciada: ' + BUILDINGS[arg].n); else toast(r.why); renderAll(); break; }
    case 'demolish': demolish(arg); renderAll(); break;
    case 'cancel': cancelQueue(+arg); renderAll(); break;
    case 'research': if (techAvailable(arg)) { S.research.cur = arg; toast('Investigando: ' + TECHS[arg].n); renderAll(); } break;
    case 'law': { const [l, o] = arg.split('|'); const r = enactLaw(l, o); toast(r.ok ? 'Ley aprobada: ' + LAWS[l].opts[o].n : r.why); renderAll(); break; }
    case 'tax': { const [c, v] = arg.split('|'); S.taxes[c] = +v; renderAll(); break; }
    case 'loan': { const r = takeLoan(+arg); toast(r.ok ? 'Préstamo concedido' : r.why); renderAll(); break; }
    case 'repay': { const r = repayLoan(+arg); toast(r.ok ? 'Deuda amortizada' : r.why); renderAll(); break; }
    case 'default': confirmBox('Suspender pagos cancela toda la deuda, pero arruina tu crédito durante 10 años, cuesta prestigio y enfurece a los capitalistas.', 'default-now'); break;
    case 'default-now': declareDefault(); closeModal(); renderAll(); break;
  }
}

/* --- Tooltip --- */
function hideTip() { const t = $('#tip'); if (t) t.style.display = 'none'; UI.tipEl = null; }
function onMove(e) {
  const el = e.target.closest ? e.target.closest('[data-tip]') : null;
  const t = $('#tip');
  if (!el) { if (UI.tipEl) hideTip(); return; }
  if (UI.tipEl !== el) { t.innerHTML = el.getAttribute('data-tip'); t.style.display = 'block'; UI.tipEl = el; }
  const pad = 14, r = t.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > window.innerWidth - 6) x = e.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 6) y = e.clientY - r.height - pad;
  t.style.left = Math.max(4, x) + 'px'; t.style.top = Math.max(4, y) + 'px';
}

/* =====================================================================
   Sección 14: ARRANQUE
   ===================================================================== */
function init() {
  newGame();
  let loaded = false;
  try { if (localStorage.getItem('valoria_save_auto') && localStorage.getItem('valoria_seen')) { /* se ofrece en el menú Cargar */ } } catch (e) { /* sin almacenamiento */ }
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || el.getAttribute('aria-disabled') === 'true') return;
    const a = el.getAttribute('data-act');
    if (a === 'savemenu') UI.lastSL = 'save'; if (a === 'loadmenu') UI.lastSL = 'load';
    act(a, el.getAttribute('data-arg'), el);
  });
  document.addEventListener('input', e => {
    const el = e.target; const k = el.getAttribute && el.getAttribute('data-spend'); if (!k) return;
    S.spend[k] = +el.value;
    const sv = document.getElementById('sv-' + k); if (sv) sv.textContent = el.value + '%';
    const se = document.getElementById('se-' + k); if (se) se.textContent = money(SPEND[k].base * S.spend[k] / 100 * spendScale());
  });
  document.addEventListener('change', e => { if (e.target.getAttribute && e.target.getAttribute('data-spend')) { renderTop(); } });
  document.addEventListener('mousedown', () => { UI.mouseDown = true; });
  document.addEventListener('mouseup', () => { UI.mouseDown = false; });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('keydown', e => {
