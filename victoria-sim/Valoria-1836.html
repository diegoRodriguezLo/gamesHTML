<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valoria 1836 — Gran Estrategia Económica</title>
<style>
/* =====================================================================
   ESTILOS — estética de mapa político del siglo XIX
   ===================================================================== */
:root {
  --bg: #0d1520; --bg2: #111c2a; --bg3: #16243a;
  --parch: #241f17; --parch2: #2c261b; --parch3: #362e20;
  --gold: #c9a227; --gold2: #e6c75a; --gold-dim: #8a7234;
  --text: #ebe2cb; --muted: #a59c86; --faint: #6f6858;
  --border: #4a3e26; --border2: #5e4e2c;
  --red: #c8553d; --green: #7bb35a; --blue: #5b8fc7; --amber: #d89a2e;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--text); font: 14px/1.45 var(--sans);
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 30% 20%, rgba(201,162,39,.06), transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(91,143,199,.06), transparent 55%),
    repeating-linear-gradient(0deg, rgba(201,162,39,.035) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(90deg, rgba(201,162,39,.035) 0 1px, transparent 1px 64px);
  overflow: hidden;
}
h1, h2, h3, h4 { font-family: var(--serif); color: var(--gold); font-weight: normal; margin: 0 0 .5em; letter-spacing: .02em; }
h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
h3 { font-size: 1.12em; }
button { font: inherit; cursor: pointer; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.pos { color: var(--green); } .neg { color: var(--red); } .warn { color: var(--amber); } .gold { color: var(--gold2); }
.small { font-size: .86em; }
.serif { font-family: var(--serif); }
.right { text-align: right; }
.hidden { display: none !important; }

/* ---------- Disposición general ---------- */
#app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
#top {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 10px;
  background: linear-gradient(180deg, #1c2a3e, #121d2c); border-bottom: 2px solid var(--gold-dim);
  box-shadow: 0 2px 12px rgba(0,0,0,.5); position: relative; z-index: 5;
}
#top .brand { font-family: var(--serif); color: var(--gold); font-size: 1.25em; margin-right: 6px; white-space: nowrap; }
#top .brand small { color: var(--muted); font-size: .65em; display: block; margin-top: -3px; letter-spacing: .12em; }
.stat {
  display: flex; flex-direction: column; padding: 2px 9px; border: 1px solid var(--border); border-radius: 4px;
  background: rgba(36,31,23,.75); min-width: 76px; cursor: help;
}
.stat .l { font-size: .7em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .v { font-family: var(--serif); font-size: 1.05em; white-space: nowrap; }
.stat.date .v { color: var(--gold2); min-width: 128px; }
.speed { display: flex; gap: 2px; }
.speed button, .btn {
  background: linear-gradient(180deg, #3a3122, #262016); color: var(--text); border: 1px solid var(--border2);
  border-radius: 4px; padding: 4px 9px; transition: .12s;
}
.speed button:hover, .btn:hover:not([aria-disabled=true]) { border-color: var(--gold); color: var(--gold2); }
.speed button.on { background: linear-gradient(180deg, #8a7234, #5e4e22); color: #fff6d8; border-color: var(--gold); }
.btn.primary { background: linear-gradient(180deg, #a68620, #6e5815); color: #fff8dd; border-color: var(--gold2); }
.btn.danger { background: linear-gradient(180deg, #6e2a1e, #4a1a12); border-color: #8e3a2a; }
.btn[aria-disabled=true] { opacity: .42; cursor: not-allowed; }
.btn.sm { padding: 2px 7px; font-size: .86em; }
.spacer { flex: 1; }

#main { display: grid; grid-template-columns: 190px 1fr; min-height: 0; }
#tabs { background: linear-gradient(180deg, #121d2b, #0d1520); border-right: 1px solid var(--border); padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
#tabs button {
  text-align: left; padding: 9px 10px; border: 1px solid transparent; border-radius: 4px; background: transparent;
  color: var(--muted); font-family: var(--serif); font-size: 1.02em; display: flex; gap: 8px; align-items: center;
}
#tabs button:hover { color: var(--text); background: rgba(201,162,39,.07); }
#tabs button.on { color: var(--gold2); border-color: var(--border2); background: linear-gradient(90deg, rgba(201,162,39,.16), rgba(201,162,39,.02)); }
#tabs .ic { width: 22px; text-align: center; }
#tabs .badge { margin-left: auto; background: var(--red); color: #fff; border-radius: 9px; font: 11px var(--sans); padding: 0 6px; }
#tabs .foot { margin-top: auto; font-size: .78em; color: var(--faint); padding: 6px; line-height: 1.35; }
#panel { overflow-y: auto; padding: 16px 20px 40px; min-height: 0; }

/* ---------- Paneles tipo pergamino ---------- */
.card {
  background: linear-gradient(180deg, var(--parch2), var(--parch)); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px 14px; box-shadow: inset 0 0 0 1px rgba(201,162,39,.06), 0 3px 10px rgba(0,0,0,.35);
  position: relative;
}
.card::before { content: ''; position: absolute; inset: 3px; border: 1px solid rgba(201,162,39,.08); border-radius: 4px; pointer-events: none; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.gauto { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
@media (max-width: 1250px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } #main { grid-template-columns: 64px 1fr; } #tabs .lbl, #tabs .foot { display: none; } }
.mt { margin-top: 14px; }
.kpi { display: flex; flex-direction: column; gap: 2px; cursor: help; }
.kpi .l { color: var(--muted); font-size: .78em; text-transform: uppercase; letter-spacing: .07em; }
.kpi .v { font-family: var(--serif); font-size: 1.5em; color: var(--text); }
.kpi .s { font-size: .82em; color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: .8em; border: 1px solid var(--border2); color: var(--muted); }
.tag.good { color: var(--green); border-color: #3f5e2e; } .tag.bad { color: var(--red); border-color: #6a2e22; } .tag.gold { color: var(--gold2); border-color: var(--gold-dim); }

/* Barras */
.bar { height: 8px; background: #15110b; border: 1px solid #3a311f; border-radius: 4px; overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); }
.bar.green > i { background: linear-gradient(90deg, #4c7a34, var(--green)); }
.bar.red > i { background: linear-gradient(90deg, #7a2e20, var(--red)); }
.bar.blue > i { background: linear-gradient(90deg, #355a83, var(--blue)); }
.bar.tall { height: 14px; }
.bar .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff8; }

/* Tablas */
table { width: 100%; border-collapse: collapse; }
th { font-family: var(--serif); font-weight: normal; color: var(--gold); text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--border2); font-size: .92em; white-space: nowrap; }
td { padding: 5px 6px; border-bottom: 1px solid rgba(74,62,38,.45); vertical-align: middle; }
tr:hover td { background: rgba(201,162,39,.045); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.locked td { opacity: .5; }

/* Tooltip */
#tip {
  position: fixed; z-index: 100; max-width: 340px; pointer-events: none; padding: 9px 11px; font-size: .88em; line-height: 1.45;
  background: linear-gradient(180deg, #2f281b, #211c13); border: 1px solid var(--gold-dim); border-radius: 5px; color: var(--text);
  box-shadow: 0 6px 22px rgba(0,0,0,.6); display: none;
}
#tip b { color: var(--gold2); font-weight: normal; font-family: var(--serif); }
[data-tip] { cursor: help; }
button[data-tip] { cursor: pointer; }

/* Modal */
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(5,9,15,.72); display: flex; align-items: center; justify-content: center; padding: 20px; }
#modal .box {
  width: min(640px, 100%); max-height: 90vh; overflow-y: auto; background: linear-gradient(180deg, #2f2819, #1f1a12);
  border: 2px solid var(--gold-dim); border-radius: 8px; padding: 22px 26px; box-shadow: 0 10px 50px rgba(0,0,0,.7), inset 0 0 0 4px rgba(201,162,39,.08);
}
#modal .box.wide { width: min(820px, 100%); }
#modal h2 { text-align: center; border: none; font-size: 1.7em; }
#modal .evic { text-align: center; font-size: 2.6em; line-height: 1; margin-bottom: 4px; }
#modal .evtext { font-family: var(--serif); font-size: 1.07em; line-height: 1.6; color: #e8dcbf; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 12px 4px; margin-bottom: 14px; font-style: italic; }
.opt { display: block; width: 100%; text-align: left; margin: 7px 0; padding: 10px 14px; background: linear-gradient(180deg, #3d3323, #2a2318); border: 1px solid var(--border2); border-radius: 5px; color: var(--text); }
.opt:hover { border-color: var(--gold); background: linear-gradient(180deg, #4a3e28, #30281b); }
.opt b { font-family: var(--serif); font-weight: normal; color: var(--gold2); font-size: 1.05em; }
.opt span { display: block; color: var(--muted); font-size: .88em; margin-top: 2px; }
#modal ul { padding-left: 20px; } #modal li { margin: 4px 0; }

/* Mapa */
.map svg { width: 100%; height: auto; display: block; }
.map .prov { stroke: #c9a227; stroke-width: 1.3; stroke-opacity: .7; transition: .2s; }
.map .prov:hover { fill-opacity: .95; stroke-width: 2.4; }
.map text { font-family: var(--serif); fill: #2a2112; font-size: 11px; pointer-events: none; }

/* Varios */
.chart { width: 100%; height: 210px; display: block; }
.legend { display: flex; gap: 14px; font-size: .82em; color: var(--muted); margin-top: 4px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 5px; }
.log { list-style: none; padding: 0; margin: 0; max-height: 260px; overflow-y: auto; }
.log li { padding: 5px 2px; border-bottom: 1px dashed rgba(74,62,38,.6); font-size: .9em; }
.log li .d { color: var(--gold-dim); font-family: var(--serif); margin-right: 6px; white-space: nowrap; }
.log li.bad { color: #e9a08f; } .log li.good { color: #b6dc9c; } .log li.tech { color: #9cc2ea; } .log li.law { color: #e6c75a; }
.alerts li { list-style: none; padding: 4px 0; }
.alerts { padding: 0; margin: 0; }
.tech { border: 1px solid var(--border); border-radius: 5px; padding: 9px 10px; margin-bottom: 9px; background: rgba(20,17,11,.55); cursor: pointer; transition: .12s; }
.tech:hover { border-color: var(--gold); }
.tech.done { border-color: #3f5e2e; background: rgba(60,90,40,.18); cursor: default; }
.tech.cur { border-color: var(--gold2); box-shadow: 0 0 0 1px var(--gold) inset, 0 0 12px rgba(201,162,39,.25); }
.tech.lock { opacity: .45; cursor: not-allowed; }
.tech .tn { font-family: var(--serif); color: var(--gold2); }
.tech.done .tn { color: var(--green); }
.tech .td { font-size: .84em; color: var(--muted); margin: 2px 0 5px; }
.slider { width: 100%; accent-color: var(--gold); }
input[type=range] { cursor: pointer; }
.lawopts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.lawopt { padding: 6px 9px; border: 1px solid var(--border2); border-radius: 4px; background: rgba(20,17,11,.5); color: var(--text); font-size: .9em; }
.lawopt.on { border-color: var(--gold); background: linear-gradient(180deg, #6e5815, #3f320c); color: #fff3cc; cursor: default; }
.lawopt[aria-disabled=true]:not(.on) { opacity: .45; cursor: not-allowed; }
.lawopt.on { cursor: default; }
.lawopt:not(.on):not([aria-disabled=true]):hover { border-color: var(--gold2); }
.popcard .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.popcard .head .ic { font-size: 1.6em; }
.popcard .head h3 { margin: 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: .9em; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.taxlvl { display: flex; gap: 3px; }
.taxlvl button { flex: 1; padding: 3px 0; font-size: .8em; border: 1px solid var(--border2); border-radius: 3px; background: rgba(20,17,11,.5); color: var(--muted); }
.taxlvl button.on { background: linear-gradient(180deg, #8a7234, #5e4e22); color: #fff; border-color: var(--gold); }
.flash { animation: flash 1s; }
@keyframes flash { from { background: rgba(201,162,39,.35); } to { background: transparent; } }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-track { background: #0d1520; } ::-webkit-scrollbar-thumb { background: #3a311f; border-radius: 5px; } ::-webkit-scrollbar-thumb:hover { background: #5e4e2c; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 60; background: #2f281b; border: 1px solid var(--gold); padding: 8px 16px; border-radius: 5px; display: none; box-shadow: 0 4px 20px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <div id="main">
    <nav id="tabs"></nav>
    <section id="panel"></section>
  </div>
</div>
<div id="tip"></div>
<div id="toast"></div>
<div id="modal" class="hidden"><div class="box"></div></div>
<script>
'use strict';
/* =====================================================================
   VALORIA 1836 — Simulación económica y política
   Sección 1: UTILIDADES
   ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
let rand = Math.random;
const sum = (arr) => arr.reduce((a, b) => a + b, 0);
function fmt(n, d = 0) {
  if (!isFinite(n)) return '—';
  return n.toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtK(n) {
  const a = Math.abs(n);
  if (a >= 1e6) return fmt(n / 1e6, 2) + ' M';
  if (a >= 1e4) return fmt(n / 1e3, 1) + ' k';
  return fmt(n, 0);
}
function money(n) { return fmtK(n) + ' £'; }
function pct(n, d = 0) { return fmt(n * 100, d) + '%'; }

/* =====================================================================
   Sección 2: DATOS DEL JUEGO (mercancías, clases, edificios, leyes...)
   ===================================================================== */
const START_YEAR = 1836, END_YEAR = 1936;
const TOTAL_MONTHS = (END_YEAR - START_YEAR + 1) * 12;
const MONTH_NAMES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

const GOODS = {
  grano:        { n: 'Grano', base: 20, ic: '🌾' },
  carne:        { n: 'Carne', base: 30, ic: '🍖' },
  madera:       { n: 'Madera', base: 20, ic: '🌲' },
  ropa:         { n: 'Ropa', base: 30, ic: '👕', trend: -0.30 },
  muebles:      { n: 'Muebles', base: 40, ic: '🪑', trend: -0.20 },
  herramientas: { n: 'Herramientas', base: 40, ic: '🔨', trend: -0.30 },
  hierro:       { n: 'Hierro', base: 40, ic: '⚙', trend: -0.15 },
  carbon:       { n: 'Carbón', base: 30, ic: '⛏' },
  petroleo:     { n: 'Petróleo', base: 40, ic: '🛢', tech: 'p10' },
  electricidad: { n: 'Electricidad', base: 30, ic: '⚡', tech: 'p9', notrade: true },
  papel:        { n: 'Papel', base: 30, ic: '📜' },
  medicinas:    { n: 'Medicinas', base: 50, ic: '💊' },
  lujo:         { n: 'Artículos de lujo', base: 60, ic: '💎' },
};
const GOOD_IDS = Object.keys(GOODS);

const CLASS_IDS = ['terratenientes', 'capitalistas', 'artesanos', 'obreros', 'campesinos', 'burocratas', 'militares', 'clero'];
const CLASSES = {
  terratenientes: { n: 'Terratenientes', ic: '🏰', mult: 8, exp: 52, start: 40, wealth: 4000, save: 0.15, birth: 0.024, inc0: 80,
    desc: 'Dueños de la tierra. Cobran rentas de las granjas de subsistencia y los beneficios de plantaciones y haciendas.' },
  capitalistas: { n: 'Capitalistas', ic: '🎩', mult: 10, exp: 52, start: 10, wealth: 2000, save: 0.30, birth: 0.024, inc0: 50,
    desc: 'Propietarios de minas, fábricas y bancos. Su riqueza no gastada alimenta la capacidad de inversión privada.' },
  artesanos: { n: 'Artesanos', ic: '⚒', mult: 1.5, exp: 38, start: 300, wealth: 600, save: 0.03, birth: 0.030, inc0: 4.6,
    desc: 'Producen ropa, muebles y herramientas a mano. La industria barata los arruina y acaban como obreros.' },
  obreros: { n: 'Obreros', ic: '🏭', mult: 1.2, exp: 32, start: 160, wealth: 100, save: 0.02, birth: 0.034, inc0: 4,
    desc: 'Trabajan en minas, aserraderos y fábricas a cambio de un salario. Si no hay empleo, vuelven al campo.' },
  campesinos: { n: 'Campesinos', ic: '🌾', mult: 1, exp: 28, start: 6500, wealth: 3000, save: 0.02, birth: 0.036, inc0: 2.9,
    desc: 'La inmensa mayoría. Cultivan en granjas de subsistencia o trabajan en plantaciones. Fuente de mano de obra industrial.' },
  burocratas: { n: 'Burócratas', ic: '📋', mult: 2, exp: 44, start: 40, wealth: 300, save: 0.05, birth: 0.026, inc0: 10,
    desc: 'Funcionarios pagados con el gasto en administración. Mejoran la recaudación.' },
  militares: { n: 'Militares', ic: '⚔', mult: 1.5, exp: 38, start: 60, wealth: 200, save: 0.03, birth: 0.026, inc0: 7,
    desc: 'Oficiales y soldados pagados con el gasto militar. Si se enfadan, pueden dar un golpe de estado.' },
  clero: { n: 'Clero', ic: '⛪', mult: 2.5, exp: 42, start: 60, wealth: 600, save: 0.05, birth: 0.020, inc0: 10,
    desc: 'Viven del diezmo y de la educación. Su tamaño e influencia dependen de la relación Iglesia-Estado.' },
};

// Necesidades por cada 1.000 habitantes y mes (multiplicadas por el factor de consumo de la clase)
const NEEDS = [
  { n: 'Subsistencia', w: 30, g: { grano: 0.10, madera: 0.02 } },
  { n: 'Necesidades básicas', w: 25, g: { carne: 0.03, ropa: 0.04, herramientas: 0.01 } },
  { n: 'Confort', w: 25, g: { muebles: 0.02, papel: 0.01, medicinas: 0.01, electricidad: 0.015 } },
  { n: 'Lujo', w: 20, g: { lujo: 0.03, carne: 0.01, petroleo: 0.006 } },
];

const OPULENCE = { lujo: 0.4, muebles: 0.2, ropa: 0.15, carne: 0.15, papel: 0.1 };
const WAGE_BASE = { campesinos: 2.6, obreros: 5, artesanos: 6, burocratas: 8, clero: 7, militares: 6, capitalistas: 0, terratenientes: 0 };

// Categorías: agri (agricultura), ext (extracción), ind (industria), serv (servicios/estado)
const BUILDINGS = {
  subsistencia: { n: 'Granja de subsistencia', cat: 'agri', auto: true, ic: '🛖',
    desc: 'Se ajusta sola: todos los campesinos sin otro empleo cultivan para sobrevivir. Produce 0,13 de grano y 0,025 de madera por cada 1.000 campesinos. El 15% va a los terratenientes como renta.' },
  granja: { n: 'Plantación de grano', cat: 'agri', ic: '🌾', owner: 'terratenientes', cost: 1200, goods: { madera: 15, herramientas: 5 }, months: 6, max: 100,
    work: { campesinos: 40 }, in: { herramientas: 0.2 }, out: { grano: 8 }, maint: 5, desc: 'Agricultura comercial. Mucho más productiva que la subsistencia.' },
  hacienda: { n: 'Hacienda ganadera', cat: 'agri', ic: '🐄', owner: 'terratenientes', cost: 1400, goods: { madera: 20, herramientas: 4 }, months: 6, max: 60,
    work: { campesinos: 30 }, in: { grano: 1 }, out: { carne: 6 }, maint: 5, desc: 'Cría de ganado. La carne es una necesidad básica.' },
  lujo: { n: 'Plantación de lujo', cat: 'agri', ic: '🍷', owner: 'terratenientes', cost: 2000, goods: { madera: 15, herramientas: 5 }, months: 8, max: 40,
    work: { campesinos: 40 }, in: { herramientas: 0.3 }, out: { lujo: 4 }, maint: 6, desc: 'Vino, tabaco y café para las clases ricas.' },
  aserradero: { n: 'Aserradero', cat: 'ext', ic: '🪓', owner: 'capitalistas', cost: 1500, goods: { herramientas: 8, hierro: 4 }, months: 6, max: 60,
    work: { obreros: 20 }, in: { herramientas: 0.2 }, out: { madera: 8 }, maint: 5, desc: 'Madera para construir, para muebles y para calentar los hogares.' },

let S = null;

function newGame() {
  const s = {
    ver: 1, month: 0, treasury: 50000, debt: 0, credit: 1, defaultTimer: 0, bankruptMonths: 0, pool: 5000,
    literacy: 0.12, prestige: 110, eventPrestige: 0, military: 0, navy: 0, tension: 10, stability: 60, health: 0.3,
    pops: {}, taxes: {}, spend: {}, laws: { censo: 'autocracia', consumo: 'moderado', laborales: 'ninguno', arancel: 'mercantil', iglesia: 'estado' },
    lawCooldown: 0, bld: {}, queue: [], market: {}, techs: {}, research: { cur: null, prog: {}, bank: 0 }, rp: 0,
    powers: POWERS.map(p => ({ id: p.id, n: p.n, color: p.color, gdp: p.gdp, mil: p.mil, navy: p.navy, lit: p.lit, g: p.g, techs: 0, prestige: 0, pop: Math.round(p.gdp / 4) })),
    hist: { gdp: [], pop: [], price: [], sol: [], prestige: [] }, log: [], mods: [], evLast: {}, evOnce: {}, pendingEvent: null, gameOver: null,
    gdp: 0, refGdpPc: 0, budget: null, power: {}, groupPower: {}, groupSat: {}, jobs: {}, wages: {}, govWork: {}, gdpParts: {},
  };
  const taxDef = { terratenientes: 1, capitalistas: 1, artesanos: 2, obreros: 2, campesinos: 2, burocratas: 1, militares: 1, clero: 0 };
  for (const c of CLASS_IDS) {
    const cl = CLASSES[c];
    s.pops[c] = { pop: cl.start, wealth: cl.wealth, income: cl.inc0 * cl.start, net: cl.inc0 * cl.start, spent: 0, sol: 40, sat: 50, radical: 0, taxPaid: 0, unemp: 0, tiers: [1, 0, 0, 0], growth: 0 };
    s.taxes[c] = taxDef[c];
  }
  for (const k of SPEND_IDS) s.spend[k] = SPEND[k].def;
  for (const g of GOOD_IDS) s.market[g] = { price: GOODS[g].base, world: GOODS[g].base, supply: 0, demand: 0, imp: 0, exp: 0, fill: 1, sold: 1, dPop: 0, dIn: 0, dGov: 0, dCon: 0 };
  for (const id of BUILDING_IDS) s.bld[id] = { level: START_BUILDINGS[id] || 0, eff: 0, staff: 0, profit: 0, revenue: 0, pm: 1 };
  S = s;
  // Asentar precios y rentas antes de empezar (no avanza la fecha)
  for (let i = 0; i < 8; i++) tick(true);
  S.treasury = 50000; S.debt = 0; S.pool = 5000; S.bankruptMonths = 0;
  for (const c of CLASS_IDS) S.pops[c].pop = CLASSES[c].start;
  S.hist = { gdp: [], pop: [], price: [], sol: [], prestige: [] };
  S.log = [];
  S.prestige = prestigeTarget();
  for (const p of S.powers) p.prestige = powerPrestigeTarget(p);
  recordHistory();
  addLog('Enero de 1836: comienza tu gobierno de Valoria. El país es agrario, pobre y conservador. ¡Industrialízalo!', 'info');
  return S;
}

/* =====================================================================
   Sección 4: FUNCIONES AUXILIARES DE LA SIMULACIÓN
   ===================================================================== */
const year = () => START_YEAR + Math.floor(S.month / 12);
const monthOfYear = () => S.month % 12;
function dateStr(m = S.month) { return MONTH_NAMES[m % 12] + ' de ' + (START_YEAR + Math.floor(m / 12)); }
function avail(g) { const t = GOODS[g].tech; return !t || !!S.techs[t]; }
function totalPop() { let t = 0; for (const c of CLASS_IDS) t += S.pops[c].pop; return t; }
function lvl(id) { return S.bld[id].level; }
function addLog(msg, type = 'info') { S.log.unshift({ m: S.month, t: msg, type }); if (S.log.length > 200) S.log.length = 200; }

function addMod(key, val, months, cls, label) { S.mods.push({ key, val, months, cls: cls || null, label: label || '' }); }
function modSum(key, cls) {
  let t = 0;
  for (const m of S.mods) if (m.key === key && (m.cls === null || m.cls === cls)) t += m.val;
  return t;
}

function prodMult(b) {
  const t = S.techs; let m = 1;
  if (b.cat === 'agri') { if (t.p2) m += 0.15; if (t.p8) m += 0.25; }
  if (b.cat === 'ext') { if (t.p4) m += 0.15; }
  if (b.cat === 'ind') { if (t.p4) m += 0.15; if (t.p11) m += 0.30; }
  if (t.p5 && b.cat !== 'serv') m += 0.10;
  m += S.spend.infra / 100 * 0.08;
  m *= Math.max(0.2, 1 + modSum('prod_' + b.cat) + modSum('prod'));
  return m;
}
function avgProd() { return (prodMult(BUILDINGS.granja) + prodMult(BUILDINGS.mina_hierro) + prodMult(BUILDINGS.textil)) / 3; }

function militaryTech() { const t = S.techs; return 1 + (t.m1 ? 0.10 : 0) + (t.m2 ? 0.15 : 0) + (t.m4 ? 0.20 : 0) + (t.m5 ? 0.25 : 0) + (t.m6 ? 0.30 : 0); }
function fund(k) { return S.spend[k] / 100 * (S.bankruptMonths > 0 ? 0.5 : 1); }
function adminCapacity() { return fund('admin') * (S.techs.s3 ? 1.2 : 1) * (1 + modSum('admin')); }
function taxEfficiency() { return clamp(0.35 + 0.35 * S.literacy + 0.3 * Math.min(1.2, adminCapacity()) + (S.stability - 50) / 500, 0.2, 0.97); }
function tradeCap() {
  const law = LAWS.arancel.opts[S.laws.arancel];
  let c = (20 + 20 * lvl('puerto') * (S.bld.puerto.staff || 1)) * law.cap;
  if (S.techs.p5) c *= 1.3;
  if (S.techs.m3) c *= 1.2;
  c *= 1 + fund('marina') * 0.3;
  return c;
}
function interestRate() { return Math.max(0.02, 0.04 + 0.06 * (1 - S.credit) - 0.003 * lvl('banco') + (S.defaultTimer > 0 ? 0.03 : 0)); }
function creditLimit() {
  const inc = S.budget ? S.budget.income : 2500;
  return Math.max(0, (inc * 12 * 2 + 10000) * S.credit * (S.defaultTimer > 0 ? 0.3 : 1));
}
function spendScale() {
  const pc = S.refGdpPc > 0 ? (S.gdp / totalPop()) / S.refGdpPc : 1;
  return clamp(Math.pow(totalPop() / 7210, 0.8) * Math.pow(Math.max(0.3, pc), 0.6), 0.5, 8);
}
function constructionSpeed() {
  let s = 0.5 + fund('infra') * 0.7 + (S.techs.p5 ? 0.25 : 0) + lvl('aceria') * 0.02;
  if (S.bankruptMonths > 0) s *= 0.3;
  return s;
}
function constructionSlots() { return 2 + Math.floor(S.spend.infra / 25) + (S.techs.p5 ? 1 : 0); }
function researchPoints() {
  const u = lvl('universidad') * (S.bld.universidad.staff || 0);
  return (3 + S.literacy * 12 + u * 2.5) * (S.techs.s2 ? 1.1 : 1) * (1 + modSum('research'));
}
function techAvailable(id) { const t = TECHS[id]; return !S.techs[id] && t.req.every(r => S.techs[r]); }

function buildCost(id) {
  const b = BUILDINGS[id]; let goods = 0;
  for (const g in b.goods) goods += b.goods[g] * S.market[g].price;
  return { money: b.cost, goods, total: Math.round(b.cost + goods) };
}
function buildingLocked(id) { const b = BUILDINGS[id]; return b.tech && !S.techs[b.tech]; }
function queuedCount(id) { return S.queue.filter(q => q.id === id).length; }
function canBuild(id) {
  const b = BUILDINGS[id];
  if (b.auto) return { ok: false, why: 'Se ajusta automáticamente.' };
  if (buildingLocked(id)) return { ok: false, why: 'Requiere la tecnología «' + TECHS[b.tech].n + '».' };
  if (lvl(id) + queuedCount(id) >= b.max) return { ok: false, why: 'Nivel máximo alcanzado (' + b.max + ').' };
  const c = buildCost(id);
  const fromPool = b.state ? 0 : Math.min(S.pool, c.total);
  const fromTreasury = c.total - fromPool;
  if (fromTreasury > 0 && S.treasury < fromTreasury) return { ok: false, why: 'Fondos insuficientes: faltan ' + money(fromTreasury - S.treasury) + ' en el tesoro.' };
  if (S.bankruptMonths > 0 && fromTreasury > 0) return { ok: false, why: 'El Estado está en impago: no puede financiar obras.' };

}
function build(id) {
  const r = canBuild(id); if (!r.ok) return r;
  S.pool -= r.fromPool; S.treasury -= r.fromTreasury;
  S.queue.push({ id, prog: 0 });
  return r;
}
function demolish(id) {

  S.bld[id].level--; addLog('Se ha demolido un nivel de ' + BUILDINGS[id].n + '.', 'info'); return true;
}
function cancelQueue(i) {
  const q = S.queue[i]; if (!q) return;
  const refund = Math.round(buildCost(q.id).total * 0.5 * (1 - q.prog / BUILDINGS[q.id].months));
  S.treasury += refund; S.queue.splice(i, 1);
  addLog('Obra cancelada: ' + BUILDINGS[q.id].n + '. Se recuperan ' + money(refund) + '.', 'info');

/* --- Poder político y grupos de interés --- */
function computePower() {
  const law = S.laws.censo, P = S.pops; const w = {};
  const elite = { terratenientes: 50, capitalistas: 20, clero: 10, militares: 12, burocratas: 10, artesanos: 0.2, obreros: 0.05, campesinos: 0.02 };
  for (const c of CLASS_IDS) {
    const pc = Math.max(0.1, P[c].net / Math.max(1, P[c].pop));
    if (law === 'autocracia') w[c] = P[c].pop * elite[c];
    else if (law === 'censitario') w[c] = P[c].pop * Math.pow(pc, 1.6);
    else if (law === 'masculino') w[c] = P[c].pop * Math.pow(pc, 0.4);
    else w[c] = P[c].pop * Math.pow(pc, 0.12);
  }
  const t = sum(Object.values(w)) || 1;
  for (const c of CLASS_IDS) S.power[c] = w[c] / t;
  for (const g of GROUP_IDS) {
    let pw = 0, satW = 0, satS = 0;
    for (const c in GROUPS[g].mem) {
      const m = GROUPS[g].mem[c];
      pw += S.power[c] * m;
      satW += P[c].pop * m; satS += P[c].pop * m * P[c].sat;
    }
    S.groupPower[g] = pw;
    S.groupSat[g] = satW > 0 ? satS / satW : 50;
  }
}
function lawStanceForClass(c) {
  let tot = 0, wsum = 0;
  GROUP_IDS.forEach((g, gi) => {
    const m = GROUPS[g].mem[c]; if (!m) return;
    let st = 0; for (const l of LAW_IDS) st += LAWS[l].opts[S.laws[l]].st[gi];
    tot += st * m; wsum += m;
  });
  return wsum > 0 ? tot / wsum : 0;
}
function lawSupport(law, opt) {
  const cur = LAWS[law].opts[S.laws[law]], nw = LAWS[law].opts[opt];
  let pro = 0, contra = 0;
  GROUP_IDS.forEach((g, gi) => {
    const d = nw.st[gi] - cur.st[gi];
    if (d > 0) pro += S.groupPower[g] * Math.min(2, d); else if (d < 0) contra += S.groupPower[g] * Math.min(2, -d);
  });
  return { pro, contra };
}
function canEnact(law, opt) {
  if (S.laws[law] === opt) return { ok: false, why: 'Ya está en vigor.' };
  const o = LAWS[law].opts[opt];
  if (o.tech && !S.techs[o.tech]) return { ok: false, why: 'Requiere la tecnología «' + TECHS[o.tech].n + '».' };
  if (S.lawCooldown > 0) return { ok: false, why: 'El parlamento necesita ' + S.lawCooldown + ' meses más antes de otra reforma.' };
  const sp = lawSupport(law, opt);
  if (sp.pro < sp.contra * 0.8) return { ok: false, why: 'Apoyo insuficiente: ' + pct(sp.pro) + ' a favor frente a ' + pct(sp.contra) + ' en contra (ponderado por poder).' };
  return { ok: true, sp };
}
function enactLaw(law, opt, forced) {
  if (!forced) { const r = canEnact(law, opt); if (!r.ok) return r; }
  const cur = LAWS[law].opts[S.laws[law]], nw = LAWS[law].opts[opt];
  GROUP_IDS.forEach((g, gi) => {
    const d = nw.st[gi] - cur.st[gi];
    if (d < 0) for (const c in GROUPS[g].mem) addMod('sat', d * 4, 24, c, 'Reforma: ' + nw.n);
  });
  S.laws[law] = opt;
  if (!forced) { S.lawCooldown = 12; S.tension = clamp(S.tension + 3, 0, 100); }
  addLog('Nueva ley: ' + LAWS[law].n + ' → ' + nw.n + '.', 'law');
  return { ok: true };
}

/* --- Préstamos --- */
function takeLoan(amount) {
  if (S.debt + amount > creditLimit()) return { ok: false, why: 'Superarías el límite de crédito (' + money(creditLimit()) + ').' };
  S.debt += amount; S.treasury += amount; addLog('Préstamo de ' + money(amount) + ' al ' + pct(interestRate(), 1) + ' anual.', 'money');
  return { ok: true };
}
function repayLoan(amount) {
  amount = Math.min(amount, S.debt);
  if (amount <= 0) return { ok: false, why: 'No hay deuda.' };
  if (S.treasury < amount) return { ok: false, why: 'Tesoro insuficiente.' };
  S.debt -= amount; S.treasury -= amount; addLog('Amortizados ' + money(amount) + ' de deuda.', 'money');
  return { ok: true };
}
function declareDefault() {
  if (S.debt <= 0) return { ok: false, why: 'No hay deuda que repudiar.' };
  addLog('¡Suspensión de pagos! Se repudian ' + money(S.debt) + ' de deuda. El crédito de Valoria se hunde.', 'bad');
  S.debt = 0; S.credit = 0.15; S.defaultTimer = 120; S.eventPrestige -= 25; S.pool *= 0.5;
  if (S.treasury < 0) S.treasury = 0;
  S.bankruptMonths = 0;
  addMod('sat', -20, 60, 'capitalistas', 'Suspensión de pagos');
  addMod('sat', -8, 36, 'terratenientes', 'Suspensión de pagos');
  S.tension = clamp(S.tension + 8, 0, 100);
  return { ok: true };
}

/* =====================================================================
   Sección 5: TICK MENSUAL
   Orden: 1 producción · 2 precios · 3 compras y rentas · 4 impuestos ·
   5 gasto público · 6 sociedad · 7 investigación · 8 eventos · 9 fin
   ===================================================================== */
function tick(warm) {
  if (!warm && (S.gameOver || S.pendingEvent)) return;
  const ctx = { warm: !!warm };
  stepProduction(ctx);
  stepMarket(ctx);
  stepIncome(ctx);
  stepTaxes(ctx);
  stepGovernment(ctx);
  stepSociety(ctx);
  if (warm) return;
  stepResearch(ctx);
  stepWorld(ctx);
  stepEvents(ctx);
  S.month++;
  recordHistory();
  stepCheck(ctx);
}

/* ---------- 1. PRODUCCIÓN ---------- */
function computeWages(ctx) {
  const lab = LAWS.laborales.opts[S.laws.laborales].wage;
  const techW = 1 + (avgProd() - 1) * 0.6;
  const agriW = 1 + (prodMult(BUILDINGS.granja) - 1) * 0.6;
  const P = S.pops, jobs = ctx.jobs;
  const tight = c => 0.85 + 0.3 * clamp(jobs[c] / Math.max(1, P[c].pop), 0, 1);
  const w = {};
  w.obreros = WAGE_BASE.obreros * lab * techW * tight('obreros') * (1 + modSum('wage', 'obreros'));
  w.artesanos = WAGE_BASE.artesanos * lab * techW;
  w.campesinos = WAGE_BASE.campesinos * agriW * (1 + modSum('wage', 'campesinos'));
  w.burocratas = WAGE_BASE.burocratas * techW;
  w.clero = WAGE_BASE.clero * techW;
  w.militares = WAGE_BASE.militares * techW;
  w.capitalistas = 0; w.terratenientes = 0;
  ctx.wage = w; S.wages = w;
}
function stepProduction(ctx) {
  const M = S.market, P = S.pops;
  ctx.price = {};
  for (const g of GOOD_IDS) { const m = M[g]; ctx.price[g] = m.price; m.supply = 0; m.dIn = 0; m.dPop = 0; m.dGov = 0; m.dCon = 0; }
  // Empleo
  const jobs = {}; for (const c of CLASS_IDS) jobs[c] = 0;
  for (const id of BUILDING_IDS) {
    const b = BUILDINGS[id], lv = lvl(id); if (!lv || b.auto) continue;
    for (const c in b.work) jobs[c] += b.work[c] * lv;
  }
  const er = {}; for (const c of CLASS_IDS) er[c] = jobs[c] > 0 ? Math.min(1, P[c].pop / jobs[c]) : 1;
  ctx.jobs = jobs; ctx.er = er; S.jobs = jobs;
  computeWages(ctx);
  // Edificios
  ctx.rec = {};
  for (const id of BUILDING_IDS) {
    const b = BUILDINGS[id], lv = lvl(id), B = S.bld[id];
    if (b.auto) continue;
    if (!lv) { B.eff = 0; B.staff = 0; B.profit = 0; B.revenue = 0; continue; }
    let staff = 1; for (const c in b.work) staff = Math.min(staff, er[c]);
    let inF = 1; for (const g in b.in) inF = Math.min(inF, M[g].fill);
    const pm = prodMult(b);
    let eb = 0;
    if (b.cat === 'ind' && S.techs.p9) { M.electricidad.dIn += 0.6 * lv * staff * inF; eb = 0.2 * M.electricidad.fill; }
    const eff = staff * inF;
    const ins = {}, outs = {};
    for (const g in b.in) { ins[g] = b.in[g] * lv * eff; M[g].dIn += ins[g]; }
    for (const g in b.out) { outs[g] = b.out[g] * lv * eff * pm * (1 + eb); M[g].supply += outs[g]; }
    if (b.cat === 'ind' && S.techs.p9) ins.electricidad = 0.6 * lv * staff * inF;
    B.eff = eff; B.staff = staff; B.pm = pm * (1 + eb); B.inF = inF;
    ctx.rec[id] = { ins, outs, staff, eff };
  }
  // Subsistencia
  const campEmp = Math.min(P.campesinos.pop, jobs.campesinos);
  const sub = Math.max(0, P.campesinos.pop - campEmp);
  const pmA = 1 + (prodMult(BUILDINGS.granja) - 1) * 0.5;
  ctx.sub = { pop: sub, grano: sub * 0.13 * pmA, madera: sub * 0.025 * pmA };
  M.grano.supply += ctx.sub.grano; M.madera.supply += ctx.sub.madera;
  S.bld.subsistencia.level = Math.ceil(sub / 40); S.bld.subsistencia.eff = 1; S.bld.subsistencia.staff = 1; S.bld.subsistencia.pm = pmA;
  // Artesanos por cuenta propia
  const artFree = Math.max(0, P.artesanos.pop - jobs.artesanos * er.artesanos);
  const artF = Math.min(M.madera.fill, M.grano.fill);
  const apm = 1 + (S.techs.p4 ? 0.05 : 0);
  ctx.art = { pop: artFree, ins: { madera: 0.03 * artFree * artF, grano: 0.04 * artFree * artF },
    outs: { ropa: 0.10 * artFree * artF * apm, muebles: 0.03 * artFree * artF * apm, herramientas: 0.02 * artFree * artF * apm } };
  for (const g in ctx.art.ins) M[g].dIn += ctx.art.ins[g];
  for (const g in ctx.art.outs) M[g].supply += ctx.art.outs[g];
  // Desempleo
  for (const c of CLASS_IDS) P[c].unemp = 0;
  P.obreros.unemp = Math.max(0, P.obreros.pop - jobs.obreros);
}

/* ---------- 2. MERCADO Y PRECIOS ---------- */
function govGoodsPlan(ctx) {
  const sc = spendScale(), M = S.market, pr = ctx.price; const q = {};
  const add = (g, value) => { if (avail(g)) q[g] = (q[g] || 0) + value / pr[g]; };
  const E = k => SPEND[k].base * S.spend[k] / 100 * sc;
  add('papel', E('admin') * 0.2);
  add('ropa', E('ejercito') * 0.35 * 0.4); add('herramientas', E('ejercito') * 0.35 * 0.3); add('grano', E('ejercito') * 0.35 * 0.3);
  add('madera', E('marina') * 0.6 * 0.4); add('hierro', E('marina') * 0.6 * 0.3); add('carbon', E('marina') * 0.6 * 0.3);
  add('papel', E('educacion') * 0.3);
  add('medicinas', E('sanidad') * 0.5);
  add('madera', E('infra') * 0.5 * 0.4); add('hierro', E('infra') * 0.5 * 0.3); add('carbon', E('infra') * 0.5 * 0.3);
  add('lujo', E('corte') * 0.2);
  ctx.govGoods = q;
  for (const g in q) M[g].dGov += q[g];
}
function stepMarket(ctx) {
  const M = S.market, P = S.pops, pr = ctx.price;
  const ctax = LAWS.consumo.opts[S.laws.consumo].rate; ctx.ctax = ctax;
  // Demanda de la población por jerarquía de necesidades
  ctx.pd = {};
  for (const c of CLASS_IDS) {
    const p = P[c], cl = CLASSES[c];
    let budget = Math.max(0, p.net * (1 - cl.save) + p.wealth * 0.03);
    const tiers = [];
    for (const t of NEEDS) {
      let cost = 0; const q = {}, full = {};
      for (const g in t.g) { if (!avail(g)) continue; full[g] = t.g[g] * cl.mult * p.pop; cost += full[g] * pr[g] * (1 + ctax); }
      const frac = cost > 0 ? Math.min(1, budget / cost) : 0;
      budget -= cost * frac;
      for (const g in full) { q[g] = full[g] * frac; M[g].dPop += q[g]; }
      tiers.push({ frac, q, full });
    }
    // Gasto suntuario: lo que sobra tras cubrir todas las necesidades se gasta en parte en bienes caros
    if (budget > 0 && tiers[3].frac >= 0.999) {
      const extra = budget * 0.6, q = {};
      for (const g in OPULENCE) if (avail(g)) { q[g] = extra * OPULENCE[g] / (pr[g] * (1 + ctax)); M[g].dPop += q[g]; }
      tiers.push({ frac: 1, q, full: {}, opulence: true });
    }
    ctx.pd[c] = tiers;
  }
  govGoodsPlan(ctx);
  // Construcción
  const slots = constructionSlots();
  S.queue.forEach((it, i) => {
    if (i >= slots) return; const b = BUILDINGS[it.id];
    for (const g in b.goods) if (avail(g)) M[g].dCon += b.goods[g] / b.months;
  });
  // Comercio exterior y precios
  const law = LAWS.arancel.opts[S.laws.arancel], cap = tradeCap();
  ctx.tariffRev = 0; ctx.tradeVol = 0; ctx.impVal = 0; ctx.expVal = 0;
  for (const g of GOOD_IDS) {
    const m = M[g], base = GOODS[g].base;
    if (!avail(g)) { m.fill = 1; m.sold = 1; m.imp = 0; m.exp = 0; m.demand = 0; continue; }
    const D = m.dPop + m.dIn + m.dGov + m.dCon, Sp = m.supply;
    m.demand = D;
    let imp = 0, exp = 0;
    const tradeable = !GOODS[g].notrade && law.open > 0;
    if (tradeable) {
      if (D > Sp && m.price >= m.world * (1 + law.tariff) * 0.95) imp = Math.min(cap, D - Sp);
      else if (Sp > D && m.price <= m.world * 1.05) exp = Math.min(cap, Sp - D);
    }
    m.imp = imp; m.exp = exp;
    m.fill = D > 0 ? Math.min(1, (Sp + imp) / D) : 1;
    m.sold = Sp > 0 ? Math.min(1, (D - imp + exp) / Sp) : 1;
    const eps = base * 0.02;
    const ratio = (D + exp + eps) / (Sp + imp + eps);
    let np = m.price * Math.pow(clamp(ratio, 0.5, 2), 0.3);
    if (tradeable && (imp > 0 || exp > 0)) {
      const target = imp > 0 ? m.world * (1 + law.tariff) : m.world;
      np += (target - np) * 0.2 * law.open;
    }
    m.price = clamp(np, base * 0.35, base * 5);
    ctx.tariffRev += imp * m.world * law.tariff;
    ctx.impVal += imp * m.world; ctx.expVal += exp * m.world;
    ctx.tradeVol += (imp + exp) * m.world;
  }
}

/* ---------- 3. COMPRAS DE LA POBLACIÓN Y REPARTO DE RENTAS ---------- */
function stepIncome(ctx) {
  const M = S.market, P = S.pops, pr = ctx.price, w = ctx.wage;
  const inc = {}; for (const c of CLASS_IDS) inc[c] = 0;
  let gdp = 0; ctx.stateBld = 0; const parts = { agri: 0, ext: 0, ind: 0, serv: 0, subs: 0, art: 0, gov: 0 };
  // Compras: consumo efectivo según disponibilidad
  ctx.spent = {}; ctx.ctaxBase = 0;
  for (const c of CLASS_IDS) {
    let spent = 0;
    for (const t of ctx.pd[c]) for (const g in t.q) spent += t.q[g] * M[g].fill * pr[g] * (1 + ctx.ctax);
    ctx.spent[c] = spent; ctx.ctaxBase += spent;
  }
  // Edificios
  for (const id of BUILDING_IDS) {
    const b = BUILDINGS[id], r = ctx.rec[id], B = S.bld[id]; if (!r) continue;
    const lv = lvl(id);
    let revenue = 0, inputCost = 0;
    for (const g in r.outs) revenue += r.outs[g] * pr[g] * M[g].sold;
    for (const g in r.ins) inputCost += r.ins[g] * pr[g];
    if (b.serv) revenue += b.serv * lv * r.eff * (1 + (avgProd() - 1) * 0.5);
    let wagesDue = 0; const wd = {};
    for (const c in b.work) { wd[c] = b.work[c] * lv * r.staff * w[c]; wagesDue += wd[c]; }
    const maint = b.maint * lv;
    if (b.state) {
      const cost = wagesDue + inputCost + maint;
      for (const c in wd) inc[c] += wd[c];
      ctx.stateBld += cost; B.profit = -cost; B.revenue = 0;
      parts.gov += wagesDue;
      gdp += wagesDue;
    } else {
      const va = revenue - inputCost - maint;
      let paid = wagesDue;
      if (va < wagesDue) paid = Math.max(0, va);
      const k = wagesDue > 0 ? paid / wagesDue : 0;
      for (const c in wd) inc[c] += wd[c] * k;
      // Reparto de beneficios: parte del excedente sube los salarios
      let bonus = 0;
      if (va > wagesDue && wagesDue > 0) {
        bonus = (va - wagesDue) * LAWS.laborales.opts[S.laws.laborales].share;
        for (const c in wd) inc[c] += bonus * wd[c] / wagesDue;
      }
      const profit = va - paid - bonus;
      inc[b.owner] += profit;
      B.wagePer = 0; { let wk = 0; for (const c in b.work) wk += b.work[c] * lv * r.staff; B.wagePer = wk > 0 ? (paid + bonus) / wk : 0; }
      B.profit = profit; B.revenue = revenue; B.wageCut = 1 - k;
      gdp += Math.max(0, revenue - inputCost); parts[b.cat] += Math.max(0, revenue - inputCost);
    }
  }
  // Subsistencia (15% de renta para los terratenientes)
  const sv = ctx.sub.grano * pr.grano * M.grano.sold + ctx.sub.madera * pr.madera * M.madera.sold;
  inc.campesinos += sv * 0.85; inc.terratenientes += sv * 0.15; gdp += sv; parts.subs = sv;
  // Artesanos
  let av = 0; for (const g in ctx.art.outs) av += ctx.art.outs[g] * pr[g] * M[g].sold;
  for (const g in ctx.art.ins) av -= ctx.art.ins[g] * pr[g];
  inc.artesanos += av; gdp += Math.max(0, av); parts.art = av;
  // Comerciantes
  inc.capitalistas += ctx.tradeVol * 0.04;
  ctx.inc = inc; ctx.gdp = gdp; ctx.parts = parts;
}

/* ---------- 4. RECAUDACIÓN ---------- */
function stepTaxes(ctx) {
  const P = S.pops, eff = taxEfficiency(); ctx.taxEff = eff;
  ctx.net = {}; ctx.taxByClass = {}; let total = 0;
  for (const c of CLASS_IDS) {
    const g = ctx.inc[c];
    const t = Math.max(0, g) * TAX_LEVELS[S.taxes[c]].r * eff;
    ctx.taxByClass[c] = t; total += t;
    P[c].income = g; P[c].taxPaid = t;
    ctx.net[c] = g - t;
  }
  ctx.incomeTax = total;
  ctx.ctaxRev = ctx.ctaxBase * ctx.ctax / (1 + ctx.ctax) * eff;
  // Diezmo
  const tr = LAWS.iglesia.opts[S.laws.iglesia].tithe; let tithe = 0;
  for (const c of CLASS_IDS) if (c !== 'clero' && ctx.net[c] > 0) { const t = ctx.net[c] * tr; ctx.net[c] -= t; tithe += t; }
  ctx.net.clero += tithe; ctx.tithe = tithe;
}

/* ---------- 5. GASTO PÚBLICO ---------- */
function stepGovernment(ctx) {
  const P = S.pops, net = ctx.net, sc = spendScale();
  const exp = {}; for (const k of SPEND_IDS) exp[k] = SPEND[k].base * S.spend[k] / 100 * sc;
  const sep = S.laws.iglesia === 'separacion';
  const teach = sep ? 'burocratas' : 'clero';
  net.burocratas += exp.admin * 0.8;
  net.militares += exp.ejercito * 0.65 + exp.marina * 0.4;
  if (S.laws.iglesia === 'libertad') { net.clero += exp.educacion * 0.35; net.burocratas += exp.educacion * 0.35; }
  else net[teach] += exp.educacion * 0.7;
  net[teach] += exp.sanidad * 0.5;
  net.obreros += exp.infra * 0.5;
  net.terratenientes += exp.corte * 0.6; net.clero += exp.corte * 0.2;
  // Bienestar
  const wmult = S.techs.s8 ? 1.5 : 1;
  const wb = P.campesinos.pop + P.obreros.pop + P.obreros.unemp * 2 + P.artesanos.pop * 0.5;
  if (wb > 0) {
    const wv = exp.bienestar * wmult;
    net.campesinos += wv * P.campesinos.pop / wb;
    net.obreros += wv * (P.obreros.pop + P.obreros.unemp * 2) / wb;
    net.artesanos += wv * P.artesanos.pop * 0.5 / wb;
  }
  const payroll = exp.admin * 0.8 + exp.ejercito * 0.65 + exp.marina * 0.4 + exp.educacion * 0.7 + exp.sanidad * 0.5 + exp.infra * 0.5;
  ctx.parts.gov += payroll; ctx.gdp += payroll;
  // Balance
  const interest = S.debt * interestRate() / 12;
  const income = ctx.incomeTax + ctx.ctaxRev + ctx.tariffRev;
  const spendTotal = sum(Object.values(exp));
  const expenses = spendTotal + ctx.stateBld + interest;
  S.budget = { income, expenses, balance: income - expenses, incomeTax: ctx.incomeTax, ctax: ctx.ctaxRev, tariff: ctx.tariffRev, exp, stateBld: ctx.stateBld, interest, taxByClass: ctx.taxByClass, taxEff: ctx.taxEff, tithe: ctx.tithe };
  if (!ctx.warm) {
    S.treasury += income - expenses;
    if (S.treasury < 0) {
      const need = -S.treasury, room = Math.max(0, creditLimit() - S.debt);
      const b = Math.min(need, room);
      if (b > 0) { S.debt += b; S.treasury += b; }
      if (S.treasury < 0) {
        S.bankruptMonths++;
        if (S.bankruptMonths === 1) addLog('¡El Estado no puede pagar sus gastos! Estamos en impago. Recorta gastos, sube impuestos o suspende pagos. 24 meses así significan la bancarrota.', 'bad');
      } else S.bankruptMonths = 0;
    } else S.bankruptMonths = 0;
  }
  // Rentas netas finales, ahorro e inversión privada
  for (const c of CLASS_IDS) {
    const p = P[c];
    p.net = net[c];
    p.spent = ctx.spent[c];
    let sav = p.net - p.spent;
    if (!ctx.warm) {
      if (sav > 0 && c === 'capitalistas') { S.pool += sav * 0.7; sav *= 0.3; }
      else if (sav > 0 && c === 'terratenientes') { S.pool += sav * 0.25; sav *= 0.75; }
      p.wealth = Math.max(0, p.wealth + sav);
    }
  }
  if (!ctx.warm) S.pool += 60 * lvl('banco') * (S.bld.banco.staff || 0);
  S.gdp = ctx.gdp; S.gdpParts = ctx.parts;
  if (!S.refGdpPc && !ctx.warm) S.refGdpPc = ctx.gdp / totalPop();
  if (ctx.warm) S.refGdpPc = ctx.gdp / totalPop();
}

/* ---------- 6. NIVEL DE VIDA, DESCONTENTO Y POBLACIÓN ---------- */
function stepSociety(ctx) {
  const P = S.pops, M = S.market;
  const health = clamp(0.12 + 0.35 * fund('sanidad') + 0.03 * lvl('hospital') * (S.bld.hospital.staff || 0) + (S.techs.s5 ? 0.12 : 0) + 0.1 * (avail('medicinas') ? M.medicinas.fill * Math.min(1, M.medicinas.dPop / (totalPop() * 0.012)) : 0), 0, 1);
  S.health = health;
  const f = {}; for (const k of SPEND_IDS) f[k] = fund(k);
  const separ = S.laws.iglesia === 'separacion';
  let solSum = 0, popSum = 0;
  for (const c of CLASS_IDS) {
    const p = P[c], cl = CLASSES[c];
    // Nivel de vida
    let sol = 0; const tiersSat = [];
    ctx.pd[c].forEach((t, i) => {
      if (t.opulence) return;
      let got = 0, val = 0;
      for (const g in t.full) { val += t.full[g] * ctx.price[g]; got += t.q[g] * M[g].fill * ctx.price[g]; }
      const s = val > 0 ? got / val : 1;
      tiersSat.push(s); sol += NEEDS[i].w * s;
    });
    p.tiers = tiersSat;
    p.sol = ctx.warm ? sol : p.sol * 0.5 + sol * 0.5;
    // Satisfacción
    const expv = cl.exp + S.literacy * 20;
    let target = 50 + (p.sol - expv) * 1.3 - TAX_LEVELS[S.taxes[c]].pen + lawStanceForClass(c) * 1.5;
    if (c === 'terratenientes') target += (f.corte - 0.4) * 15;
    if (c === 'clero') target += (f.corte - 0.4) * 8 + (separ ? 0 : (f.educacion - 0.3) * 8);
    if (c === 'militares') target += (f.corte - 0.4) * 5 + (f.ejercito - 0.5) * 25;
    if (c === 'burocratas') target += (f.admin - 0.5) * 15;
    if (c === 'campesinos' || c === 'obreros') target += f.bienestar * 12;
    if (c === 'obreros') target -= (p.unemp / Math.max(1, p.pop)) * 40;
    if (S.bankruptMonths > 0) target -= 10;
    target += modSum('sat', c);
    target = clamp(target, 0, 100);
    p.sat = ctx.warm ? target : p.sat + (target - p.sat) * 0.2;
    p.radical = clamp((40 - p.sat) / 40, 0, 1);
    solSum += p.sol * p.pop; popSum += p.pop;
  }
  S.avgSol = solSum / popSum;
  computePower();
  if (ctx.warm) return;

  // Crecimiento natural
  for (const c of CLASS_IDS) {
    const p = P[c], cl = CLASSES[c];
    const deaths = 0.030 - 0.012 * health + Math.max(0, 30 - p.sol) * 0.0012 + modSum('mort');
    const births = cl.birth * (1 - 0.25 * S.literacy);
    let r = (births - deaths) / 12;
    if (p.tiers[0] < 0.6) r -= (0.6 - p.tiers[0]) * 0.02;
    const before = p.pop;
    p.pop = Math.max(1, p.pop * (1 + r));
    p.growth = p.pop - before;
  }
  // Migración
  const tp = totalPop();
  let mig = 0;
  if (S.avgSol > 42) mig = (S.avgSol - 42) * 0.0003 * tp / 12 * (1 + modSum('immig'));
  else if (S.avgSol < 30) mig = -(30 - S.avgSol) * 0.0004 * tp / 12;
  if (mig > 0) { P.campesinos.pop += mig * 0.55; P.obreros.pop += mig * 0.35; P.artesanos.pop += mig * 0.1; }
  else if (mig < 0) { P.campesinos.pop = Math.max(1, P.campesinos.pop + mig * 0.7); P.obreros.pop = Math.max(1, P.obreros.pop + mig * 0.3); }
  S.migration = mig;
  // Movilidad social
  const jobs = S.jobs;
  const move = (from, to, n) => { n = Math.min(n, P[from].pop * 0.05); if (n <= 0) return; P[from].pop -= n; P[to].pop += n; };
  const obrGap = jobs.obreros - P.obreros.pop;
  if (obrGap > 0) {
    move('campesinos', 'obreros', Math.min(obrGap * 0.06, P.campesinos.pop * 0.006));
    const artInc = P.artesanos.income / Math.max(1, P.artesanos.pop);
    if (artInc < S.wages.obreros * 0.9) move('artesanos', 'obreros', Math.min(obrGap * 0.04, P.artesanos.pop * 0.006));
  } else if (P.obreros.unemp > P.obreros.pop * 0.03) move('obreros', 'campesinos', P.obreros.unemp * 0.03);
  const artInc = P.artesanos.income / Math.max(1, P.artesanos.pop), campInc = P.campesinos.income / Math.max(1, P.campesinos.pop);
  if (artInc > campInc * 1.6) move('campesinos', 'artesanos', P.campesinos.pop * 0.0004);
  else if (artInc < campInc * 1.05) move('artesanos', 'campesinos', P.artesanos.pop * 0.003);
  const toward = (c, target, src) => {
    const gap = target - P[c].pop;
    if (gap > 0) move(src, c, gap * 0.03); else if (gap < 0) move(c, 'campesinos', -gap * 0.03);
  };
  let ind = 0, agr = 0;
  for (const id of BUILDING_IDS) { const b = BUILDINGS[id]; if (b.owner === 'capitalistas') ind += lvl(id); if (b.owner === 'terratenientes') agr += lvl(id); }
  toward('capitalistas', 5 + ind * 0.6, 'artesanos');
  toward('terratenientes', 0.005 * P.campesinos.pop + agr * 0.4, 'campesinos');
  toward('burocratas', 15 + S.spend.admin / 100 * tp * 0.008 + jobs.burocratas, 'artesanos');
  toward('militares', 10 + S.spend.ejercito / 100 * tp * 0.012 + jobs.militares, 'campesinos');
  toward('clero', LAWS.iglesia.opts[S.laws.iglesia].clero * tp + jobs.clero, 'campesinos');

  // Alfabetización
  const edu = LAWS.iglesia.opts[S.laws.iglesia].edu;
  const litT = clamp(0.06 + 0.5 * f.educacion * edu + 0.02 * lvl('universidad') * (S.bld.universidad.staff || 0) + (S.techs.s2 ? 0.05 : 0), 0, 0.98);
  S.literacy += (litT - S.literacy) * 0.004;
  S.litTarget = litT;

  // Poder militar y naval
  S.military = ((P.militares.pop / 60) * 15 * (0.3 + 0.7 * f.ejercito) + lvl('arsenal') * 8 * (S.bld.arsenal.staff || 0)) * militaryTech() * (1 + modSum('mil'));
  S.navy = (f.marina * 20 + lvl('puerto') * 3) * (S.techs.m3 ? 1.4 : 1);

  // Estabilidad y tensión revolucionaria
  let st = 0; for (const c of CLASS_IDS) st += S.power[c] * P[c].sat;
  let rad = 0; for (const c of CLASS_IDS) rad += P[c].radical * P[c].pop; rad /= tp;
  S.radicals = rad;
  S.stability = clamp(st * 0.7 + (1 - rad) * 30 - S.tension * 0.15, 0, 100);
  const milLoyal = P.militares.sat > 35 ? 1 : 0.3;
  const suppression = Math.min(1.5, S.military / 60) * 0.6 * milLoyal;
  let d = (rad * 100 - 15) / 10 - suppression - f.bienestar * 0.5 + modSum('tension');
  if (d < 0) d *= 1.5;
  S.tension = clamp(S.tension + d, 0, 100);
  S.tensionDelta = d;

  // Golpe de estado
  if (P.militares.sat < 25 && S.tension > 30 && S.groupPower.militares > 0.05 && rand() < 0.04 && !S.pendingEvent) {
    S.pendingEvent = { id: 'golpe' };
  }
  // Prestigio
  S.prestige += (prestigeTarget() - S.prestige) * 0.05;
  if (S.lawCooldown > 0) S.lawCooldown--;
  if (S.defaultTimer > 0) S.defaultTimer--; else S.credit += (1 - S.credit) * 0.01;
}
function prestigeTarget() {
  let n = 0; for (const t in S.techs) n++;
  return S.gdp / 300 + S.military * 0.6 + S.navy * 0.4 + S.literacy * 40 + n * 3 + (S.techs.m2 ? 10 : 0) + S.eventPrestige + fund('corte') * 10;
}
function powerPrestigeTarget(p) { return p.gdp / 300 + p.mil * 0.6 + p.navy * 0.4 + p.lit * 40 + p.techs * 3; }

/* ---------- 7. INVESTIGACIÓN ---------- */
function stepResearch() {
  const rp = researchPoints(); S.rp = rp;
  const R = S.research;
  if (!R.cur || S.techs[R.cur]) { R.cur = null; R.bank = Math.min(150, R.bank + rp); return; }
  let add = rp; if (R.bank > 0) { add += R.bank; R.bank = 0; }
  R.prog[R.cur] = (R.prog[R.cur] || 0) + add;
  if (R.prog[R.cur] >= TECHS[R.cur].cost) {
    const t = TECHS[R.cur];
    R.bank = Math.min(150, R.prog[R.cur] - t.cost);
    S.techs[R.cur] = true;
    addLog('Investigación completada: ' + t.n + '. ' + t.d, 'tech');
    R.cur = null;
  }
}

/* ---------- Mundo: precios mundiales, potencias, construcción, modificadores ---------- */
function stepWorld() {
  const yrs = (S.month) / 12;
  for (const g of GOOD_IDS) {
    const m = S.market[g], base = GOODS[g].base;
    const trend = base * (1 + (GOODS[g].trend || 0) * clamp(yrs / 70, 0, 1)) * (1 + modSum('world'));
    m.world *= 1 + (rand() - 0.5) * 0.05;
    m.world += (trend - m.world) * 0.06;
    m.world = clamp(m.world, base * 0.3, base * 3);
  }
  // Potencias rivales
  for (const p of S.powers) {
    p.g = clamp(p.g + (rand() - 0.5) * 0.0008, 0.005, 0.022);
    p.gdp *= 1 + p.g / 12 + (rand() - 0.5) * 0.004;
    p.mil *= 1 + (p.g * 0.9) / 12 + (rand() - 0.5) * 0.003;
    p.navy *= 1 + (p.g * 0.8) / 12;
    p.lit = Math.min(0.95, p.lit + (0.9 - p.lit) * 0.0025);
    p.techs = Math.min(25, p.techs + 0.021 * (1 + p.lit));
    p.pop *= 1 + 0.009 / 12;
    p.prestige += (powerPrestigeTarget(p) - p.prestige) * 0.05;
  }
  // Construcción
  const slots = constructionSlots(), sp = constructionSpeed();
  for (let i = 0; i < Math.min(slots, S.queue.length); i++) S.queue[i].prog += sp;
  for (let i = S.queue.length - 1; i >= 0; i--) {
    const q = S.queue[i];
    if (q.prog >= BUILDINGS[q.id].months) {
      S.bld[q.id].level++; S.queue.splice(i, 1);
      addLog('Obra terminada: ' + BUILDINGS[q.id].n + ' (nivel ' + lvl(q.id) + ').', 'build');
    }
  }
  // Modificadores temporales
  for (const m of S.mods) m.months--;
  S.mods = S.mods.filter(m => m.months > 0);
}
function recordHistory() {
  const H = S.hist; let pi = 0, wsum = 0;
  for (const g of GOOD_IDS) if (avail(g)) { const w = S.market[g].demand + 1; pi += S.market[g].price / GOODS[g].base * w; wsum += w; }
  H.gdp.push(Math.round(S.gdp * 12));
  H.pop.push(Math.round(totalPop()));
  H.price.push(+(pi / wsum * 100).toFixed(1));
  H.sol.push(+(S.avgSol || 0).toFixed(1));
  H.prestige.push(Math.round(S.prestige));
}
function powerRanking() {
  const list = S.powers.map(p => ({ id: p.id, n: p.n, color: p.color, prestige: p.prestige, gdp: p.gdp, mil: p.mil, navy: p.navy, lit: p.lit, pop: p.pop, me: false }));
  list.push({ id: 'valoria', n: 'Valoria', color: '#c9a227', prestige: S.prestige, gdp: S.gdp, mil: S.military, navy: S.navy, lit: S.literacy, pop: totalPop(), me: true });
  list.sort((a, b) => b.prestige - a.prestige);
  return list;
}
function myRank() { return powerRanking().findIndex(p => p.me) + 1; }

function warThreshold() { const r = powerRanking().filter(p => !p.me); return sum(r.map(p => p.mil)) / r.length; }

function stepEvents() {
  if (S.pendingEvent) return;
  if (S.month < 6) return;
  const ids = Object.keys(EVENTS);
  // orden aleatorio para no favorecer siempre al primero
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  for (const id of ids) {
    const e = EVENTS[id];
    if (e.forced) continue;
    if (e.once && S.evOnce[id]) continue;
    if (S.evLast[id] !== undefined && S.month - S.evLast[id] < (e.cd || 120)) continue;
    let ok = false; try { ok = e.cond(); } catch (err) { ok = false; }
    if (!ok) continue;
    const p = typeof e.p === 'function' ? e.p() : e.p;
    if (rand() < p) {
      S.pendingEvent = { id };
      S.evLast[id] = S.month; if (e.once) S.evOnce[id] = true;
      return;
    }
  }
}
function eventText(id) { const e = EVENTS[id]; return typeof e.txt === 'function' ? e.txt() : e.txt; }
function eventTip(o) { return typeof o.tip === 'function' ? o.tip() : o.tip; }
function resolveEvent(i) {
  const pe = S.pendingEvent; if (!pe) return;
  const e = EVENTS[pe.id], o = e.opts[i] || e.opts[0];
  o.fx();
  S.tension = clamp(S.tension, 0, 100);
  addLog(e.t + ': ' + o.t + '.', 'event');
  S.pendingEvent = null;
}

   Sección 7: VICTORIA Y DERROTA
   ===================================================================== */
function scoreBreakdown() {
  const prestige = Math.round(S.prestige);
  const gdp = Math.round(S.gdp * 12 / 5000);
  const sol = Math.round((S.avgSol || 0) * 10);
  return { prestige, gdp, sol, total: prestige + gdp + sol };
}
function stepCheck() {
  if (S.tension >= 100) { S.gameOver = { type: 'revolucion', score: scoreBreakdown(), rank: myRank() }; addLog('¡Revolución! El gobierno ha caído.', 'bad'); return; }
  if (S.bankruptMonths >= 24) { S.gameOver = { type: 'bancarrota', score: scoreBreakdown(), rank: myRank() }; addLog('Bancarrota: el Estado ha colapsado.', 'bad'); return; }
  if (S.bankruptMonths === 12) addLog('Llevamos 12 meses en impago. ¡Quedan 12 para la bancarrota total!', 'bad');
  if (S.tension >= 80 && S.tensionDelta > 0 && S.month % 6 === 0) addLog('La tensión revolucionaria es crítica (' + fmt(S.tension) + '%). ¡Actúa ya!', 'bad');
  if (S.month >= TOTAL_MONTHS) { S.gameOver = { type: 'fin', score: scoreBreakdown(), rank: myRank() }; addLog('Diciembre de 1936: termina tu mandato.', 'info'); }
}

/* ---------- Gráficas en canvas ---------- */
function drawChart(cv, series) {
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, Hh = cv.clientHeight;
  if (W < 10) return;
  cv.width = W * dpr; cv.height = Hh * dpr;
  const x = cv.getContext('2d'); x.scale(dpr, dpr);
  const padL = 52, padR = series.some(s => s.axis === 1) ? 46 : 12, padT = 10, padB = 22;
  const n = Math.max(2, ...series.map(s => s.data.length));
  const axes = [0, 1].map(a => {
    const vals = []; series.filter(s => (s.axis || 0) === a).forEach(s => s.data.forEach(v => vals.push(v)));
    if (!vals.length) return null;
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (series.find(s => (s.axis || 0) === a).zero) lo = Math.min(0, lo);
    if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
    const pad = (hi - lo) * 0.08; const z = series.find(s => (s.axis || 0) === a).zero; return { lo: z && lo >= 0 ? Math.max(0, lo - pad) : lo - pad, hi: hi + pad };
  });
  const X = i => padL + (W - padL - padR) * i / (n - 1);
  const Y = (v, a) => padT + (Hh - padT - padB) * (1 - (v - axes[a].lo) / (axes[a].hi - axes[a].lo));
  x.font = '11px Georgia, serif'; x.lineWidth = 1;
  // rejilla
  for (let k = 0; k <= 4; k++) {
    const yy = padT + (Hh - padT - padB) * k / 4;
    x.strokeStyle = 'rgba(201,162,39,.12)'; x.beginPath(); x.moveTo(padL, yy); x.lineTo(W - padR, yy); x.stroke();
    if (axes[0]) { const v = axes[0].hi - (axes[0].hi - axes[0].lo) * k / 4; x.fillStyle = '#a59c86'; x.textAlign = 'right'; x.fillText(fmtK(v), padL - 5, yy + 4); }
    if (axes[1]) { const v = axes[1].hi - (axes[1].hi - axes[1].lo) * k / 4; x.fillStyle = '#a59c86'; x.textAlign = 'left'; x.fillText(fmt(v), W - padR + 5, yy + 4); }
  }
  // años
  const yrs = Math.ceil(n / 12); const step = yrs > 60 ? 20 : yrs > 25 ? 10 : yrs > 8 ? 5 : 1;
  x.fillStyle = '#a59c86'; x.textAlign = 'center';
  for (let m = 0; m < n; m += 12) {
    const yy = START_YEAR + m / 12; if ((yy - START_YEAR) % step) continue;
    x.fillText(String(yy), X(m), Hh - 6);
    x.strokeStyle = 'rgba(201,162,39,.07)'; x.beginPath(); x.moveTo(X(m), padT); x.lineTo(X(m), Hh - padB); x.stroke();
  }
  // series
  for (const s of series) {
    if (s.data.length < 2) continue;
    const a = s.axis || 0;
    if (s.fill) {
      const gr = x.createLinearGradient(0, padT, 0, Hh - padB); gr.addColorStop(0, s.color + '55'); gr.addColorStop(1, s.color + '05');
      x.fillStyle = gr; x.beginPath(); x.moveTo(X(0), Hh - padB);
      s.data.forEach((v, i) => x.lineTo(X(i), Y(v, a))); x.lineTo(X(s.data.length - 1), Hh - padB); x.closePath(); x.fill();
    }
    x.strokeStyle = s.color; x.lineWidth = 1.8; x.beginPath();
    s.data.forEach((v, i) => { if (i === 0) x.moveTo(X(i), Y(v, a)); else x.lineTo(X(i), Y(v, a)); });
    x.stroke();
  }
  x.strokeStyle = 'rgba(201,162,39,.35)'; x.lineWidth = 1; x.strokeRect(padL, padT, W - padL - padR, Hh - padT - padB);
}
