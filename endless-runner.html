<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Endless Runner</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0d1117; font-family: "Segoe UI", system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: linear-gradient(#0f2027, #203a43, #2c5364); }
  #hud { position: fixed; top: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 18px; pointer-events: none; z-index: 5; }
  .pill { background: rgba(0,0,0,.45); color: #e6edf3; padding: 6px 14px; border-radius: 999px; font-size: 15px; font-weight: 600; letter-spacing: .5px; border: 1px solid rgba(255,255,255,.12); }
  .pill .coin-ico { color: #ffd34d; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(6,10,16,.72); backdrop-filter: blur(3px); z-index: 10; text-align: center; padding: 20px; }
  #overlay.hidden { display: none; }
  #overlay h1 { color: #fff; font-size: clamp(28px, 6vw, 52px); letter-spacing: 2px; text-shadow: 0 0 24px rgba(64,180,255,.5); }
  #overlay .sub { color: #9fb3c8; font-size: clamp(13px, 2.6vw, 17px); line-height: 1.7; }
  #overlay .big-score { color: #ffd34d; font-size: clamp(22px, 5vw, 34px); font-weight: 800; }
  #overlay button { pointer-events: auto; margin-top: 6px; padding: 13px 42px; font-size: 18px; font-weight: 700; color: #06121f; background: linear-gradient(#6fd3ff, #3aa0ff); border: 0; border-radius: 999px; cursor: pointer; box-shadow: 0 6px 20px rgba(58,160,255,.4); }
  #overlay button:active { transform: scale(.96); }
  #touchHint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.35); font-size: 12px; pointer-events: none; z-index: 4; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div id="hud">
  <div class="pill">🏃 <span id="scoreVal">0</span></div>
  <div class="pill"><span class="coin-ico">●</span> <span id="coinVal">0</span></div>
  <div class="pill">🏆 <span id="bestVal">0</span></div>
</div>

<div id="overlay">
  <h1 id="ovTitle">ENDLESS RUNNER</h1>
  <div class="big-score" id="ovScore"></div>
  <div class="sub" id="ovSub">
    <b>Teclado:</b> ↑ / Espacio = saltar · ↓ = deslizar<br>
    <b>Táctil:</b> toca arriba = saltar · toca abajo = deslizar<br>
    Esquiva los obstáculos y recoge monedas. ¡La velocidad no para de subir!
  </div>
  <button id="startBtn">JUGAR</button>
</div>
<div id="touchHint"></div>

<script>
(() => {
"use strict";
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const scoreEl = document.getElementById("scoreVal");
const coinEl  = document.getElementById("coinVal");
const bestEl  = document.getElementById("bestVal");
const overlay = document.getElementById("overlay");
const ovTitle = document.getElementById("ovTitle");
const ovScore = document.getElementById("ovScore");
const ovSub   = document.getElementById("ovSub");
const startBtn = document.getElementById("startBtn");
const touchHint = document.getElementById("touchHint");

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = H * 0.82;
}
window.addEventListener("resize", resize);

// ---------- state ----------
let groundY = 0;
let running = false, dead = false;
let speed, baseSpeed, score, coins, best;
let spawnTimer, coinTimer, bgOffset, t;
const GRAV = 2600;

best = parseInt(localStorage.getItem("runner_best") || "0", 10) || 0;
bestEl.textContent = best;

const player = {
  x: 0, y: 0, vy: 0,
  w: 42, h: 62, slideH: 30,
  onGround: true, sliding: false, slideT: 0,
  runPhase: 0,
};

let obstacles = [];   // {x, w, h, type: 'block'|'low'|'tall'|'fly', coinOnTop}
let coinsArr = [];    // {x, y, r, taken, phase}
let particles = [];   // {x, y, vx, vy, life, color, size}
let clouds = [];

function reset() {
  baseSpeed = Math.max(320, W * 0.32);
  speed = baseSpeed;
  score = 0; coins = 0; t = 0;
  spawnTimer = 0.8; coinTimer = 1.2; bgOffset = 0;
  obstacles = []; coinsArr = []; particles = [];
  player.x = Math.max(60, W * 0.14);
  player.y = groundY - player.h;
  player.vy = 0; player.onGround = true; player.sliding = false; player.slideT = 0;
  clouds = [];
  for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * H * 0.3, s: 0.5 + Math.random() * 1.2, w: 60 + Math.random() * 90 });
}

// ---------- input ----------
const keys = {};
function jump() {
  if (!running || dead) return;
  if (player.onGround) {
    player.vy = -Math.sqrt(2 * GRAV * (H * 0.30)); // reaches ~30% of screen height
    player.onGround = false;
    player.sliding = false;
    puff(player.x + player.w / 2, groundY, "#cfe8ff");
  }
}
function startSlide() {
  if (!running || dead) return;
  if (player.onGround) {
    player.sliding = true; player.slideT = 0.55;
    puff(player.x + player.w / 2, groundY, "#cfe8ff");
  } else {
    player.vy = Math.max(player.vy, 600); // fast-fall
  }
}
window.addEventListener("keydown", e => {
  if (["ArrowUp","Space","ArrowDown","KeyW","KeyS"].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === "ArrowUp" || e.code === "Space" || e.code === "KeyW") jump();
  if (e.code === "ArrowDown" || e.code === "KeyS") startSlide();
  if (e.code === "Enter" && !running) startGame();
  if (e.code === "KeyP" && running) { running = false; }
});
window.addEventListener("keyup", e => {
  if ((e.code === "ArrowDown" || e.code === "KeyS") && player.sliding) player.slideT = Math.min(player.slideT, 0.12);
});
// touch: top half = jump, bottom half = slide
let touchStartY = null;
window.addEventListener("touchstart", e => {
  if (!running) return;
  const y = e.touches[0].clientY;
  touchStartY = y;
  if (y < H * 0.55) jump(); else startSlide();
}, { passive: true });
window.addEventListener("touchend", () => { if (player.sliding) player.slideT = Math.min(player.sliding ? player.slideT : 0, 0.12); touchStartY = null; }, { passive: true });

if ("ontouchstart" in window) touchHint.textContent = "Toca arriba para saltar · abajo para deslizar";

// ---------- spawning ----------
function spawnObstacle() {
  const r = Math.random();
  const diff = Math.min(1, (speed - baseSpeed) / (baseSpeed * 1.6)); // 0..1 difficulty
  let type;
  if (r < 0.34) type = "block";        // jump over (short box)
  else if (r < 0.58) type = "low";     // small hurdle, easy jump
  else if (r < 0.80) type = "tall";    // must slide under (overhang)
  else type = "fly";                   // floating drone: slide under or jump timing
  const minGap = 260 - diff * 90;
  const lastX = obstacles.length ? Math.min(...obstacles.map(o => o.x)) : Infinity;
  if (lastX < W + minGap) return;      // keep spacing fair
  const s = W + 80;
  if (type === "block") obstacles.push({ x: s, w: 40 + Math.random() * 26, h: 46 + diff * 26, type });
  if (type === "low")   obstacles.push({ x: s, w: 30, h: 26, type });
  if (type === "tall")  obstacles.push({ x: s, w: 46, h: 34, type, hang: H * 0.16 + 30 }); // hangs from top area, gap below only if sliding
  if (type === "fly")   obstacles.push({ x: s, w: 52, h: 30, type, flyY: groundY - 96 - Math.random() * 40 });
  // sometimes a coin arc above the obstacle
  if (type === "block" || type === "low") {
    const top = groundY - (type === "block" ? 72 : 60);
    for (let i = -1; i <= 1; i++) coinsArr.push({ x: s + 20 + i * 34, y: top - Math.abs(i) * 18, r: 11, taken: false, phase: Math.random() * 6 });
  }
}
function spawnCoins() {
  const n = 3 + Math.floor(Math.random() * 4);
  const baseY = groundY - 60 - Math.random() * (H * 0.22);
  const shape = Math.random();
  const s = W + 60;
  for (let i = 0; i < n; i++) {
    let y = baseY;
    if (shape < 0.4) y = baseY - Math.sin((i / (n - 1)) * Math.PI) * 60; // arc
    coinsArr.push({ x: s + i * 36, y, r: 11, taken: false, phase: Math.random() * 6 });
  }
}

function puff(x, y, color) {
  for (let i = 0; i < 8; i++) particles.push({ x, y: y - 4, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 120, life: 0.4, color, size: 3 + Math.random() * 4 });
}
function burst(x, y, color) {
  for (let i = 0; i < 14; i++) { const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 220; particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6, color, size: 2 + Math.random() * 4 }); }
}

// ---------- collision ----------
function playerBox() {
  const h = player.sliding ? player.slideH : player.h;
  const y = player.y + (player.h - h);
  return { x: player.x + 6, y: y + 4, w: player.w - 12, h: h - 8 };
}
function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function obBox(o) {
  if (o.type === "tall") return { x: o.x, y: o.hang, w: o.w, h: groundY - o.hang - 34 }; // pillar with slide gap? no: overhang from top
  if (o.type === "fly")  return { x: o.x, y: o.flyY, w: o.w, h: o.h };
  return { x: o.x, y: groundY - o.h, w: o.w, h: o.h };
}

// ---------- update ----------
function update(dt) {
  t += dt;
  speed = baseSpeed * (1 + Math.min(1.8, t / 45));       // ramps up over ~45s+
  score += dt * speed * 0.05;
  bgOffset = (bgOffset + speed * 0.25 * dt) % W;

  // player physics
  player.vy += GRAV * dt;
  player.y += player.vy * dt;
  if (player.y >= groundY - player.h) { player.y = groundY - player.h; player.vy = 0; if (!player.onGround) puff(player.x + player.w / 2, groundY, "#b8d4ee"); player.onGround = true; }
  if (player.sliding) { player.slideT -= dt; if (player.slideT <= 0) player.sliding = false; }
  player.runPhase += dt * (8 + speed / 60);

  // spawn
  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnObstacle(); spawnTimer = Math.max(0.55, 1.5 - t / 60) * (0.75 + Math.random() * 0.6); }
  coinTimer -= dt;
  if (coinTimer <= 0) { spawnCoins(); coinTimer = 1.6 + Math.random() * 2.2; }

  // move obstacles
  for (const o of obstacles) o.x -= speed * dt;
  obstacles = obstacles.filter(o => o.x + o.w > -60);
  for (const c of coinsArr) { c.x -= speed * dt; c.phase += dt * 6; }
  coinsArr = coinsArr.filter(c => c.x > -40 && !c.taken);
  for (const cl of clouds) { cl.x -= speed * 0.06 * cl.s * dt * 4; if (cl.x < -cl.w) { cl.x = W + cl.w; cl.y = 30 + Math.random() * H * 0.3; } }

  // particles
  for (const p of particles) { p.x += p.vx * dt - speed * dt * 0.4; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);

  // collisions
  const pb = playerBox();
  for (const o of obstacles) if (hit(pb, obBox(o)) && !dead) return die();
  for (const c of coinsArr) {
    const dx = (player.x + player.w / 2) - c.x, dy = (player.y + player.h / 2) - c.y;
    const rr = c.r + Math.min(player.w, player.h) / 2;
    if (dx * dx + dy * dy < rr * rr) { c.taken = true; coins++; burst(c.x, c.y, "#ffd34d"); }
  }

  scoreEl.textContent = Math.floor(score);
  coinEl.textContent = coins;
}

function die() {
  dead = true; running = false;
  burst(player.x + player.w / 2, player.y + player.h / 2, "#ff6b6b");
  const final = Math.floor(score) + coins * 10;
  if (final > best) { best = final; localStorage.setItem("runner_best", best); }
  bestEl.textContent = best;
  ovTitle.textContent = "💥 ¡CHOCASTE!";
  ovScore.textContent = `${final} pts  (${coins} monedas)`;
  ovSub.innerHTML = `Récord: <b>${best}</b> · Velocidad final: x${(speed / baseSpeed).toFixed(1)}<br>Pulsa <b>Enter</b> o el botón para reintentar`;
  startBtn.textContent = "REINTENTAR";
  setTimeout(() => overlay.classList.remove("hidden"), 350);
}

function startGame() {
  reset();
  dead = false; running = true;
  overlay.classList.add("hidden");
}
startBtn.addEventListener("click", startGame);

// ---------- draw ----------
function drawPlayer() {
  const px = player.x;
  const h = player.sliding ? player.slideH : player.h;
  const py = player.y + (player.h - h);
  ctx.save();
  // shadow
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.beginPath(); ctx.ellipse(px + player.w / 2, groundY + 6, player.w * 0.6, 7, 0, 0, Math.PI * 2); ctx.fill();
  // body
  ctx.fillStyle = "#4dc3ff";
  roundRect(px, py, player.w, h, 10); ctx.fill();
  // visor
  ctx.fillStyle = "#0a2a40";
  if (player.sliding) roundRect(px + player.w - 22, py + 6, 16, 9, 4);
  else roundRect(px + player.w - 20, py + 10, 14, 9, 4);
  ctx.fill();
  // legs (run cycle)
  if (!player.sliding) {
    ctx.strokeStyle = "#2f9fe0"; ctx.lineWidth = 7; ctx.lineCap = "round";
    const swing = player.onGround ? Math.sin(player.runPhase) * 10 : 6;
    ctx.beginPath();
    ctx.moveTo(px + 12, py + h - 4); ctx.lineTo(px + 12 + swing, py + h + 10);
    ctx.moveTo(px + player.w - 12, py + h - 4); ctx.lineTo(px + player.w - 12 - swing, py + h + 10);
    ctx.stroke();
  }
  // speed trail
  if (speed > baseSpeed * 1.3) {
    ctx.strokeStyle = "rgba(120,200,255,.35)"; ctx.lineWidth = 3;
    for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(px - 8 - i * 12, py + 12 + i * 10); ctx.lineTo(px - 26 - i * 12, py + 12 + i * 10); ctx.stroke(); }
  }
  ctx.restore();
}
function drawObstacle(o) {
  ctx.save();
  if (o.type === "fly") {
    const bob = Math.sin(t * 5 + o.x * 0.01) * 4;
    ctx.fillStyle = "#ff8a5c";
    roundRect(o.x, o.flyY + bob, o.w, o.h, 8); ctx.fill();
    ctx.fillStyle = "#3b1a10";
    ctx.beginPath(); ctx.arc(o.x + o.w / 2, o.flyY + bob + o.h / 2, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,160,110,.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(o.x + 6, o.flyY + bob - 4); ctx.lineTo(o.x + o.w - 6, o.flyY + bob - 4); ctx.stroke();
  } else if (o.type === "tall") {
    // overhang: hangs from top of obstacle zone, must SLIDE under the gap
    ctx.fillStyle = "#c05cff";
    roundRect(o.x, o.hang, o.w, groundY - o.hang - 34, 8); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.18)";
    roundRect(o.x + 6, o.hang + 6, o.w - 12, 10, 4); ctx.fill();
    // warning stripes on the safe gap
    ctx.fillStyle = "rgba(192,92,255,.25)";
    ctx.fillRect(o.x, groundY - 34, o.w, 34);
  } else {
    ctx.fillStyle = o.type === "low" ? "#ff6b6b" : "#e05252";
    roundRect(o.x, groundY - o.h, o.w, o.h, 6); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.2)";
    ctx.fillRect(o.x + 5, groundY - o.h + 5, o.w - 10, 6);
  }
  ctx.restore();
}
function drawCoin(c) {
  const sq = Math.abs(Math.cos(c.phase)); // spin illusion
  ctx.save();
  ctx.fillStyle = "#ffd34d";
  ctx.beginPath(); ctx.ellipse(c.x, c.y, c.r * Math.max(0.25, sq), c.r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#b8860b"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  // clouds
  ctx.fillStyle = "rgba(255,255,255,.08)";
  for (const cl of clouds) { ctx.beginPath(); ctx.ellipse(cl.x, cl.y, cl.w, cl.w * 0.35, 0, 0, Math.PI * 2); ctx.fill(); }
  // distant skyline (parallax)
  ctx.fillStyle = "rgba(20,40,60,.6)";
  for (let i = 0; i < 12; i++) {
    const bw = 70, bx = ((i * 160 - bgOffset * 0.5) % (W + 320)) - 160;
    const bh = 60 + ((i * 53) % 90);
    ctx.fillRect(bx, groundY - bh, bw, bh);
  }
  // ground
  ctx.fillStyle = "#1a2c3d";
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.strokeStyle = "#3aa0ff"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
  // ground dashes
  ctx.strokeStyle = "rgba(120,180,230,.3)"; ctx.lineWidth = 2;
  for (let x = -(bgOffset % 60); x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, groundY + 18); ctx.lineTo(x + 28, groundY + 18); ctx.stroke(); }

  for (const o of obstacles) drawObstacle(o);
  for (const c of coinsArr) drawCoin(c);
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / 0.6); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); ctx.globalAlpha = 1; }
  drawPlayer();

  // speed indicator
  ctx.fillStyle = "rgba(255,255,255,.5)";
  ctx.font = "600 13px system-ui";
  ctx.textAlign = "right";
  ctx.fillText("VELOCIDAD x" + (speed / baseSpeed).toFixed(2), W - 14, 28);
  ctx.textAlign = "left";
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (running && !dead) update(dt);
  else if (dead) { for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; } particles = particles.filter(p => p.life > 0); }
  draw();
  requestAnimationFrame(frame);
}

resize();
reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
